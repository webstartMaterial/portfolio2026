<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Lana: Escape from Lina</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#000;
    display:flex;align-items:center;justify-content:center;
    width:100vw;height:100vh;overflow:hidden;
    font-family:'Nunito',sans-serif;
  }
  #wrapper{
    position:relative;
    /* size set by JS */
  }
  canvas{display:block;}

  /* ── HTML overlay screens ── */
  .screen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    pointer-events:none;
  }
  .screen.active{pointer-events:all;}
  .hidden{display:none!important;}

  /* START */
  #startScreen{
    background:linear-gradient(180deg,rgba(10,0,20,.92) 0%,rgba(5,0,12,.97) 100%);
  }
  .s-title{
    font-family:'Bangers',cursive;
    font-size:clamp(2.4rem,7vw,5.2rem);
    letter-spacing:3px;line-height:1.05;
    text-align:center;
    color:#ff2d8e;
    text-shadow:0 0 12px #ff2d8e,0 0 40px #ff2d8e,0 0 80px #9b30ff,3px 3px 0 #4a0040;
    animation:titlePulse 2s ease-in-out infinite alternate;
    padding:0 20px;
  }
  .s-title span{color:#fff;text-shadow:0 0 12px #00e5ff,0 0 40px #00e5ff,3px 3px 0 #003344;}
  @keyframes titlePulse{
    from{text-shadow:0 0 12px #ff2d8e,0 0 40px #ff2d8e,3px 3px 0 #4a0040;}
    to  {text-shadow:0 0 24px #ff2d8e,0 0 80px #ff2d8e,0 0 120px #9b30ff,3px 3px 0 #4a0040;}
  }
  .s-sub{
    font-family:'Nunito',sans-serif;font-weight:700;
    font-size:clamp(.75rem,2vw,1.1rem);
    color:#cc88ff;letter-spacing:2px;text-transform:uppercase;
    margin:14px 0 36px;text-align:center;padding:0 20px;
  }
  .s-btn{
    font-family:'Bangers',cursive;font-size:clamp(1.4rem,3.5vw,2rem);
    letter-spacing:3px;
    color:#fff;background:transparent;
    border:3px solid #ff2d8e;
    padding:12px 40px;border-radius:6px;cursor:pointer;
    text-shadow:0 0 8px #ff2d8e;
    box-shadow:0 0 20px #ff2d8e,inset 0 0 20px rgba(255,45,142,.15);
    animation:btnPulse 1.4s ease-in-out infinite alternate;
    transition:background .2s;
  }
  .s-btn:hover{background:rgba(255,45,142,.2);}
  @keyframes btnPulse{
    from{box-shadow:0 0 10px #ff2d8e,inset 0 0 10px rgba(255,45,142,.1);}
    to  {box-shadow:0 0 30px #ff2d8e,0 0 60px #9b30ff,inset 0 0 20px rgba(255,45,142,.2);}
  }
  .s-controls{
    margin-top:28px;font-size:clamp(.7rem,1.8vw,.9rem);
    color:rgba(200,150,255,.6);letter-spacing:1px;text-align:center;
    line-height:1.8;
  }
  .s-controls strong{color:#ff79c6;}

  /* GAME OVER */
  #gameOverScreen{
    background:linear-gradient(180deg,rgba(30,0,10,.95) 0%,rgba(10,0,20,.98) 100%);
  }
  .go-title{
    font-family:'Bangers',cursive;
    font-size:clamp(2rem,6.5vw,4.5rem);
    letter-spacing:4px;line-height:1.1;text-align:center;
    color:#ff2d8e;
    text-shadow:0 0 20px #ff2d8e,0 0 60px #ff2d8e,3px 3px 0 #4a0040;
    animation:titlePulse 1.5s ease-in-out infinite alternate;
    padding:0 20px;
  }
  .go-time{
    font-family:'Bangers',cursive;font-size:clamp(1.2rem,3.5vw,2.2rem);
    letter-spacing:3px;color:#fff;margin:16px 0 4px;
    text-shadow:0 0 10px #00e5ff;
  }
  .go-best{
    font-family:'Nunito',sans-serif;font-weight:700;
    font-size:clamp(.8rem,2.2vw,1.1rem);
    color:#cc88ff;letter-spacing:2px;margin-bottom:30px;
  }
  .go-badge{
    display:inline-block;
    font-family:'Bangers',cursive;font-size:clamp(.85rem,2.2vw,1.2rem);
    letter-spacing:2px;color:#ffd700;
    border:2px solid #ffd700;padding:4px 16px;border-radius:4px;
    box-shadow:0 0 12px #ffd700;margin-bottom:30px;
  }
</style>
</head>
<body>
<div id="wrapper">
  <canvas id="c"></canvas>

  <!-- START SCREEN -->
  <div class="screen active" id="startScreen">
    <div class="s-title">LANA:<br><span>ESCAPE FROM LINA</span></div>
    <div class="s-sub">Fly through Lagos — dodge Lina's attacks!</div>
    <button class="s-btn" id="startBtn">▶ &nbsp;START MISSION</button>
    <div class="s-controls">
      <strong>↑ ↓</strong> or <strong>W S</strong> &nbsp;·&nbsp; Mouse / Touch to fly<br>
      One hit and Lina wins — for now.
    </div>
  </div>

  <!-- GAME OVER SCREEN -->
  <div class="screen hidden" id="gameOverScreen">
    <div class="go-title">LINA WON…<br>THIS TIME.</div>
    <div class="go-time" id="goTime">TIME: 0s</div>
    <div class="go-best" id="goBest">BEST: 0s</div>
    <div class="go-badge" id="goBadge" style="display:none">🏆 NEW RECORD!</div>
    <button class="s-btn" id="retryBtn">↺ &nbsp;TRY AGAIN</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
//  SETUP
// ═══════════════════════════════════════════════
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const wrapper = document.getElementById('wrapper');

const BASE_W = 900, BASE_H = 500;
let scale = 1, W = BASE_W, H = BASE_H;

function resize(){
  const sw = window.innerWidth / BASE_W;
  const sh = window.innerHeight / BASE_H;
  scale = Math.min(sw, sh);
  W = BASE_W; H = BASE_H;
  canvas.width  = BASE_W;
  canvas.height = BASE_H;
  canvas.style.width  = (BASE_W * scale) + 'px';
  canvas.style.height = (BASE_H * scale) + 'px';
  wrapper.style.width  = (BASE_W * scale) + 'px';
  wrapper.style.height = (BASE_H * scale) + 'px';
}
resize();
window.addEventListener('resize', resize);

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
const STATE = { START:0, PLAYING:1, DEAD:2 };
let state = STATE.START;

let lana, obstacles, particles, bgStars, bgBuildings;
let score, bestScore, speedMult, elapsed, lastTime;
let shakeTimer = 0, shakeAmt = 0;
let spawnTimer = 0, spawnInterval = 1.4;
let closeCallTimer = 0;
let keys = {};

// ── Input ──────────────────────────────────────
let mouseMoveY = null;
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if((e.key === ' ' || e.key === 'Enter') && state === STATE.START)  startGame();
  if((e.key === ' ' || e.key === 'Enter') && state === STATE.DEAD)   startGame();
  if(e.key === 'ArrowUp'   || e.key === 'w') e.preventDefault();
  if(e.key === 'ArrowDown' || e.key === 's') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseMoveY = (e.clientY - rect.top) / scale;
});
canvas.addEventListener('mouseleave', () => { mouseMoveY = null; });

// Touch
let touchY = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  touchY = (e.touches[0].clientY - rect.top) / scale;
  if(state === STATE.START) startGame();
  if(state === STATE.DEAD)  startGame();
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  touchY = (e.touches[0].clientY - rect.top) / scale;
}, {passive:false});
canvas.addEventListener('touchend', () => { touchY = null; });

// UI buttons
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

// ═══════════════════════════════════════════════
//  STARS (one-time init, reused across games)
// ═══════════════════════════════════════════════
function makeBgStars(){
  bgStars = [];
  for(let i=0;i<180;i++){
    bgStars.push({
      x: Math.random()*BASE_W,
      y: Math.random()*BASE_H*.65,
      r: Math.random()*1.4+.3,
      speed: Math.random()*.3+.05,
      bright: Math.random(),
      blinkSpeed: Math.random()*.04+.01
    });
  }
}

function makeBgBuildings(){
  bgBuildings = [];
  // Layer 1 — far, small, blue-grey
  for(let x=0;x<BASE_W+100;){
    const w = Math.random()*30+15;
    const h = Math.random()*60+25;
    bgBuildings.push({x, y:BASE_H-h, w, h, layer:1, speed:.4,
      windows: buildWindows(x,BASE_H-h,w,h,1)});
    x += w + Math.random()*8+2;
  }
  // Layer 2 — mid
  for(let x=0;x<BASE_W+200;){
    const w = Math.random()*45+20;
    const h = Math.random()*90+40;
    bgBuildings.push({x, y:BASE_H-h, w, h, layer:2, speed:.9,
      windows: buildWindows(x,BASE_H-h,w,h,2)});
    x += w + Math.random()*10+3;
  }
  // Layer 3 — near, tallest, dark
  for(let x=0;x<BASE_W+300;){
    const w = Math.random()*55+25;
    const h = Math.random()*130+60;
    bgBuildings.push({x, y:BASE_H-h, w, h, layer:3, speed:1.6,
      windows: buildWindows(x,BASE_H-h,w,h,3)});
    x += w + Math.random()*12+4;
  }
}

function buildWindows(bx,by,bw,bh,layer){
  const wins=[];
  const cols = Math.max(1, Math.floor(bw/9));
  const rows = Math.max(1, Math.floor(bh/12));
  for(let c=0;c<cols;c++){
    for(let r=0;r<rows;r++){
      if(Math.random()<.45){
        wins.push({
          cx: bx+6+c*(bw-8)/Math.max(1,cols-1),
          cy: by+8+r*(bh-14)/Math.max(1,rows-1),
          on: Math.random()<.6,
          color: Math.random()<.5?'#ffeebb':'#aaddff'
        });
      }
    }
  }
  return wins;
}

// ═══════════════════════════════════════════════
//  GAME START / RESET
// ═══════════════════════════════════════════════
bestScore = parseInt(localStorage.getItem('lana_best')||'0');

function startGame(){
  state = STATE.PLAYING;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');

  // Lana
  lana = {
    x: BASE_W * .14,
    y: BASE_H / 2,
    vy: 0,
    r: 22,          // hitbox radius
    visualR: 26,    // draw radius
    trail: [],
    angle: 0,       // gentle bob angle
    glowPhase: 0,
    dead: false,
    nearMissFlash: 0
  };

  obstacles = [];
  particles = [];
  score = 0;
  speedMult = 1;
  elapsed = 0;
  spawnTimer = 0;
  spawnInterval = 1.4;
  shakeTimer = 0;
  closeCallTimer = 0;
  lastTime = null;

  makeBgStars();
  makeBgBuildings();

  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════
//  OBSTACLE FACTORY
// ═══════════════════════════════════════════════
function spawnObstacle(){
  const type = Math.random() < .45 ? 'orb'
             : Math.random() < .6  ? 'bolt'
             :                        'circle';

  const margin = 60;
  const y = margin + Math.random()*(BASE_H - margin*2);

  const baseSpeed = (type==='bolt' ? 340 : type==='orb' ? 220 : 155) * speedMult;
  const speed = baseSpeed * (.8 + Math.random()*.4);

  const sizes = {orb:22, bolt:14, circle:34};
  obstacles.push({
    x: BASE_W + 60,
    y,
    vx: -speed,
    type,
    r: sizes[type],
    phase: Math.random()*Math.PI*2,
    rot: 0,
    wobble: (Math.random()-.5)*80,
    wobbleSpeed: Math.random()*.04+.02,
    wobbleAngle: Math.random()*Math.PI*2,
    passed: false,
    closeCall: false
  });
}

// ═══════════════════════════════════════════════
//  PARTICLE FACTORY
// ═══════════════════════════════════════════════
function addTrailParticle(x,y){
  particles.push({
    x: x + (Math.random()-.5)*8,
    y: y + (Math.random()-.5)*8,
    vx: -Math.random()*1.5 - .5,
    vy: (Math.random()-.5)*1.2,
    life: 1,
    decay: Math.random()*.03+.025,
    r: Math.random()*5+2,
    color: Math.random()<.5?'#ff2d8e':'#cc66ff'
  });
}

function addDeathParticles(x,y){
  for(let i=0;i<60;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = Math.random()*8+2;
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      life: 1,
      decay: Math.random()*.02+.01,
      r: Math.random()*8+3,
      color: ['#ff2d8e','#cc66ff','#ff79c6','#ffffff','#00e5ff'][Math.floor(Math.random()*5)]
    });
  }
}

function addCloseCallParticles(x,y){
  for(let i=0;i<12;i++){
    particles.push({
      x: x+(Math.random()-.5)*20,
      y: y+(Math.random()-.5)*20,
      vx: (Math.random()-.5)*4,
      vy: (Math.random()-.5)*4,
      life:1, decay:.06,
      r: Math.random()*4+2,
      color:'#ffd700'
    });
  }
}

// ═══════════════════════════════════════════════
//  COLLISION
// ═══════════════════════════════════════════════
function checkCollision(){
  for(const ob of obstacles){
    const dx = lana.x - ob.x;
    const dy = lana.y - ob.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const hitDist = lana.r + ob.r * .75; // slightly forgiving

    if(dist < hitDist) return ob;

    // Close-call detection
    if(!ob.closeCall && !ob.passed && ob.x < lana.x + 60 && dist < lana.r + ob.r + 30){
      ob.closeCall = true;
      closeCallTimer = .6;
      addCloseCallParticles(lana.x, lana.y);
    }
    if(ob.x < lana.x) ob.passed = true;
  }
  return null;
}

// ═══════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════
function update(dt){
  elapsed += dt;
  score = Math.floor(elapsed);

  // Speed ramp every 10s
  speedMult = 1 + Math.floor(elapsed/10)*0.12;
  // Spawn interval tightens
  spawnInterval = Math.max(.45, 1.4 - elapsed*.012);

  // ── Lana movement ──────────────────────────
  const SPEED = 340;
  const MOUSE_LERP = .14;

  if(touchY !== null){
    lana.y += (touchY - lana.y) * .18;
  } else if(mouseMoveY !== null){
    lana.y += (mouseMoveY - lana.y) * MOUSE_LERP;
  } else {
    if(keys['ArrowUp']   || keys['w']) lana.vy -= SPEED * dt * 2;
    if(keys['ArrowDown'] || keys['s']) lana.vy += SPEED * dt * 2;
    lana.vy *= .82;
    lana.y  += lana.vy * dt;
  }

  lana.y = Math.max(lana.visualR+5, Math.min(BASE_H - lana.visualR - 5, lana.y));
  lana.angle += dt;
  lana.glowPhase += dt*3;

  // Trail
  lana.trail.push({x:lana.x, y:lana.y, life:1});
  if(lana.trail.length > 18) lana.trail.shift();
  lana.trail.forEach(t => t.life -= dt*2.5);

  // Trail particles
  if(Math.random() < .35) addTrailParticle(lana.x - 20, lana.y + (Math.random()-.5)*10);

  // ── Obstacles ──────────────────────────────
  spawnTimer += dt;
  if(spawnTimer >= spawnInterval){
    spawnObstacle();
    spawnTimer = 0;
  }

  for(const ob of obstacles){
    ob.x += ob.vx * dt;
    ob.wobbleAngle += ob.wobbleSpeed * dt * 60;
    ob.y += Math.sin(ob.wobbleAngle) * ob.wobble * dt * .05;
    ob.rot += dt * (ob.type==='circle' ? 1.2 : ob.type==='bolt' ? 4 : .8);
    ob.phase += dt*4;
  }

  // Remove off-screen
  for(let i=obstacles.length-1;i>=0;i--){
    if(obstacles[i].x < -100) obstacles.splice(i,1);
  }

  // ── Particles ──────────────────────────────
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += .08; // gravity
    p.life -= p.decay;
    if(p.life <= 0) particles.splice(i,1);
  }

  // ── Stars scroll ───────────────────────────
  for(const s of bgStars){
    s.x -= s.speed * dt * 60;
    if(s.x < 0) s.x = BASE_W + 5;
    s.bright += s.blinkSpeed;
  }

  // ── Buildings scroll ──────────────────────
  for(const b of bgBuildings){
    const dx = b.speed * dt * 60;
    b.x -= dx;
    b.windows.forEach(w => w.cx -= dx);
    if(b.x + b.w < 0){
      // respawn on right
      const prev = bgBuildings.filter(bb=>bb.layer===b.layer).reduce((mx,bb)=>Math.max(mx,bb.x+bb.w),-999);
      const gap = Math.random()*12+4;
      const dx2 = prev + gap - b.x;
      b.x = prev+gap;
      b.windows.forEach(w=>{ w.cx += dx2; });
    }
  }

  // ── Close call timer ──────────────────────
  if(closeCallTimer > 0) closeCallTimer -= dt;

  // ── Collision ─────────────────────────────
  const hit = checkCollision();
  if(hit){
    addDeathParticles(lana.x, lana.y);
    shakeTimer = .7; shakeAmt = 18;
    lana.dead = true;
    state = STATE.DEAD;
    if(score > bestScore){
      bestScore = score;
      localStorage.setItem('lana_best', bestScore);
    }
    showGameOver();
  }

  // ── Shake decay ───────────────────────────
  if(shakeTimer > 0){ shakeTimer -= dt; shakeAmt *= .88; }
}

// ═══════════════════════════════════════════════
//  DRAW HELPERS
// ═══════════════════════════════════════════════
function glow(color, blur){
  ctx.shadowColor = color;
  ctx.shadowBlur  = blur;
}
function noGlow(){ ctx.shadowBlur = 0; }

// ── Background ────────────────────────────────
function drawBg(){
  // Sky gradient
  const sky = ctx.createLinearGradient(0,0,0,BASE_H*.7);
  sky.addColorStop(0,'#06001a');
  sky.addColorStop(.6,'#0a0025');
  sky.addColorStop(1,'#0d0030');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,BASE_W,BASE_H);

  // Distant glow (Lina's power on the horizon)
  const horizGlow = ctx.createRadialGradient(BASE_W*.75, BASE_H*.55, 0, BASE_W*.75, BASE_H*.55, 200);
  horizGlow.addColorStop(0,'rgba(120,0,200,.18)');
  horizGlow.addColorStop(1,'transparent');
  ctx.fillStyle = horizGlow;
  ctx.fillRect(0,0,BASE_W,BASE_H);

  // Stars
  for(const s of bgStars){
    const alpha = .35 + .65*Math.abs(Math.sin(s.bright));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }

  // City glow layer (mid)
  const cityGlow = ctx.createLinearGradient(0, BASE_H*.55, 0, BASE_H);
  cityGlow.addColorStop(0,'rgba(80,0,160,.0)');
  cityGlow.addColorStop(.5,'rgba(80,0,160,.25)');
  cityGlow.addColorStop(1,'rgba(20,0,60,.9)');
  ctx.fillStyle = cityGlow;
  ctx.fillRect(0, BASE_H*.55, BASE_W, BASE_H*.45);

  // Buildings — layer 1
  ctx.globalAlpha = 1;
  for(const b of bgBuildings){
    if(b.layer!==1) continue;
    ctx.fillStyle = '#1a0835';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    for(const w of b.windows){
      if(!w.on) continue;
      ctx.fillStyle = w.color==='#ffeebb'?'rgba(255,238,170,.3)':'rgba(150,220,255,.3)';
      ctx.fillRect(w.cx-2, w.cy-2, 4, 4);
    }
  }

  // Buildings — layer 2
  for(const b of bgBuildings){
    if(b.layer!==2) continue;
    ctx.fillStyle = '#110620';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    // Building edge glow
    glow('#9b30ff',8);
    ctx.strokeStyle='rgba(100,0,180,.4)';
    ctx.lineWidth=1;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    noGlow();
    for(const w of b.windows){
      if(!w.on) continue;
      ctx.fillStyle = w.color==='#ffeebb'?'rgba(255,220,120,.55)':'rgba(100,200,255,.55)';
      ctx.fillRect(w.cx-2.5, w.cy-3, 5, 6);
    }
  }

  // Ground strip
  const ground = ctx.createLinearGradient(0, BASE_H*.82, 0, BASE_H);
  ground.addColorStop(0,'#08001a');
  ground.addColorStop(1,'#030010');
  ctx.fillStyle = ground;
  ctx.fillRect(0, BASE_H*.82, BASE_W, BASE_H*.18);

  // Buildings — layer 3 (nearest)
  for(const b of bgBuildings){
    if(b.layer!==3) continue;
    ctx.fillStyle = '#0a0115';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    glow('#ff2d8e',6);
    ctx.strokeStyle='rgba(180,0,100,.35)';
    ctx.lineWidth=1.5;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    noGlow();
    for(const w of b.windows){
      if(!w.on) continue;
      ctx.fillStyle = w.color==='#ffeebb'?'rgba(255,200,80,.7)':'rgba(80,180,255,.7)';
      ctx.fillRect(w.cx-2.5, w.cy-3.5, 5, 7);
      glow(w.color, 4);
      ctx.fillRect(w.cx-2.5, w.cy-3.5, 5, 7);
      noGlow();
    }
  }

  // Road glow at bottom
  const road = ctx.createLinearGradient(0, BASE_H*.9, 0, BASE_H);
  road.addColorStop(0,'rgba(255,45,142,.0)');
  road.addColorStop(.5,'rgba(255,45,142,.12)');
  road.addColorStop(1,'rgba(255,45,142,.06)');
  ctx.fillStyle = road;
  ctx.fillRect(0, BASE_H*.9, BASE_W, BASE_H*.1);
}

// ── Lana ──────────────────────────────────────
function drawLana(){
  const x = lana.x, y = lana.y;
  const bob = Math.sin(lana.angle*2.5)*3;
  const tilt = lana.vy ? Math.atan2(lana.vy, 200) * .3 : 0;
  const glowAlpha = .5 + .5*Math.sin(lana.glowPhase);

  ctx.save();
  ctx.translate(x, y+bob);
  ctx.rotate(tilt);

  // Aura
  const aura = ctx.createRadialGradient(0,0,0,0,0,50);
  aura.addColorStop(0,`rgba(255,45,142,${.12*glowAlpha})`);
  aura.addColorStop(.6,`rgba(155,48,255,${.07*glowAlpha})`);
  aura.addColorStop(1,'transparent');
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(0,0,50,0,Math.PI*2); ctx.fill();

  // Cape
  ctx.save();
  ctx.translate(-8, -4);
  glow('#cc66ff', 10);
  ctx.fillStyle='#9933cc';
  ctx.beginPath();
  ctx.moveTo(0, -10);
  ctx.bezierCurveTo(-25, -5, -30, 10, -20, 18);
  ctx.bezierCurveTo(-10, 10, -5, 5, 0, 14);
  ctx.closePath();
  ctx.fill();
  noGlow();
  ctx.restore();

  // Body (silver holographic suit)
  glow('#cc99ff', 14);
  const bodyGrad = ctx.createLinearGradient(-12,-18,12,18);
  bodyGrad.addColorStop(0,'#ddeeff');
  bodyGrad.addColorStop(.4,'#aabbdd');
  bodyGrad.addColorStop(.7,'#8899cc');
  bodyGrad.addColorStop(1,'#667799');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(0, 4, 11, 18, 0, 0, Math.PI*2);
  ctx.fill();

  // Holographic shine lines
  ctx.strokeStyle='rgba(255,255,255,.35)';
  ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(-5,-12); ctx.lineTo(-3,14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3,-10); ctx.lineTo(4,12); ctx.stroke();
  noGlow();

  // Head
  glow('#ffaaee', 10);
  const headGrad = ctx.createRadialGradient(-3,-22,2,-3,-22,10);
  headGrad.addColorStop(0,'#ffddee');
  headGrad.addColorStop(.6,'#ddaabb');
  headGrad.addColorStop(1,'#aa8899');
  ctx.fillStyle = headGrad;
  ctx.beginPath(); ctx.arc(0,-22,9.5,0,Math.PI*2); ctx.fill();

  // Hair
  ctx.fillStyle='#7733aa';
  ctx.beginPath();
  ctx.arc(0,-26,7,Math.PI,0);
  ctx.bezierCurveTo(10,-20,14,-10,12,2);
  ctx.bezierCurveTo(8,-5,5,-12,0,-22);
  ctx.fill();
  glow('#9b30ff',6);
  ctx.fill(); noGlow();

  // Eye mask (blue strip)
  glow('#00e5ff', 8);
  ctx.fillStyle='#0099cc';
  ctx.beginPath();
  ctx.ellipse(0,-22,8,3,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.ellipse(-3,-22,2,1.5,-.3,0,Math.PI*2); ctx.fill();
  noGlow();

  // Crown
  glow('#ffd700', 14);
  ctx.fillStyle='#ffd700';
  ctx.beginPath();
  ctx.moveTo(-8,-30);
  ctx.lineTo(-8,-34);
  ctx.lineTo(-4,-31);
  ctx.lineTo(0,-36);
  ctx.lineTo(4,-31);
  ctx.lineTo(8,-34);
  ctx.lineTo(8,-30);
  ctx.closePath();
  ctx.fill();
  // Crown gems
  ctx.fillStyle='#ff2d8e';
  ctx.beginPath(); ctx.arc(0,-35,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ff79c6';
  ctx.beginPath(); ctx.arc(-7,-33,1.3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(7,-33,1.3,0,Math.PI*2); ctx.fill();
  noGlow();

  // LANA label on suit
  ctx.fillStyle='rgba(255,255,255,.7)';
  ctx.font = 'bold 5px Nunito';
  ctx.textAlign='center';
  ctx.fillText('LANA', 0, 6);

  ctx.restore();
}

// ── Trail ─────────────────────────────────────
function drawTrail(){
  for(let i=0;i<lana.trail.length;i++){
    const t = lana.trail[i];
    if(t.life<=0) continue;
    const alpha = t.life * .6;
    const r = 4 + (1-t.life)*8;
    const grad = ctx.createRadialGradient(t.x-20,t.y,0,t.x-20,t.y,r);
    grad.addColorStop(0,`rgba(255,45,142,${alpha})`);
    grad.addColorStop(1,'transparent');
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.arc(t.x-20,t.y,r,0,Math.PI*2); ctx.fill();
  }
}

// ── Obstacles ─────────────────────────────────
function drawObstacles(){
  for(const ob of obstacles){
    ctx.save();
    ctx.translate(ob.x, ob.y);

    if(ob.type==='orb'){
      // Purple energy orb
      const pulse = .7+.3*Math.sin(ob.phase);
      const outerR = ob.r*(1+.15*Math.sin(ob.phase*.7));
      // Outer glow rings
      glow('#9b30ff', 30*pulse);
      for(let ring=3;ring>0;ring--){
        ctx.beginPath();
        ctx.arc(0,0,ob.r+ring*6,0,Math.PI*2);
        ctx.strokeStyle=`rgba(155,48,255,${.08*ring*pulse})`;
        ctx.lineWidth=4;
        ctx.stroke();
      }
      // Core
      const orbGrad = ctx.createRadialGradient(0,0,0,0,0,outerR);
      orbGrad.addColorStop(0,'#ffffff');
      orbGrad.addColorStop(.2,'#ee88ff');
      orbGrad.addColorStop(.55,'#9b30ff');
      orbGrad.addColorStop(.8,'#5a009a');
      orbGrad.addColorStop(1,'transparent');
      ctx.fillStyle=orbGrad;
      ctx.beginPath(); ctx.arc(0,0,outerR,0,Math.PI*2); ctx.fill();
      noGlow();
    }

    else if(ob.type==='bolt'){
      // Dark lightning bolt
      ctx.rotate(ob.rot);
      glow('#dd00ff', 20);
      ctx.strokeStyle='#cc55ff';
      ctx.lineWidth=4;
      ctx.lineCap='round';
      ctx.lineJoin='round';
      ctx.beginPath();
      ctx.moveTo(0,-ob.r*2.2);
      ctx.lineTo(-ob.r*.5, 0);
      ctx.lineTo(ob.r*.2, 0);
      ctx.lineTo(-ob.r*.3, ob.r*2.2);
      ctx.stroke();
      // Inner bright core
      ctx.strokeStyle='#ffffff';
      ctx.lineWidth=1.5;
      ctx.stroke();
      // Jagged sparks
      ctx.strokeStyle='rgba(200,100,255,.5)';
      ctx.lineWidth=1;
      for(let s=0;s<3;s++){
        const sx = (Math.random()-.5)*ob.r;
        const sy = (Math.random()-.5)*ob.r*2;
        ctx.beginPath();
        ctx.moveTo(sx,sy);
        ctx.lineTo(sx+(Math.random()-.5)*16, sy+(Math.random()-.5)*16);
        ctx.stroke();
      }
      noGlow();
    }

    else { // circle — Lina's magic ring
      ctx.rotate(ob.rot);
      const pulse = .7+.3*Math.sin(ob.phase*.8);
      // Outer dark aura
      glow('#440066', 30);
      ctx.strokeStyle=`rgba(60,0,90,${.6*pulse})`;
      ctx.lineWidth=ob.r*.4;
      ctx.beginPath(); ctx.arc(0,0,ob.r*1.4,0,Math.PI*2); ctx.stroke();

      // Main ring
      glow('#cc00ff', 25*pulse);
      const ringGrad = ctx.createConicalGradient ? null : null;
      ctx.strokeStyle=`rgba(180,0,255,${pulse})`;
      ctx.lineWidth=6;
      ctx.beginPath(); ctx.arc(0,0,ob.r,0,Math.PI*2); ctx.stroke();

      // Inner ring
      ctx.strokeStyle=`rgba(255,100,255,${.7*pulse})`;
      ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(0,0,ob.r*.6,0,Math.PI*2); ctx.stroke();

      // Rotating runes on the ring
      for(let i=0;i<6;i++){
        const a = (i/6)*Math.PI*2;
        const rx = Math.cos(a)*ob.r;
        const ry = Math.sin(a)*ob.r;
        ctx.fillStyle='rgba(255,200,255,.8)';
        ctx.beginPath(); ctx.arc(rx,ry,3,0,Math.PI*2); ctx.fill();
      }

      // Center dark core
      const coreGrad = ctx.createRadialGradient(0,0,0,0,0,ob.r*.45);
      coreGrad.addColorStop(0,'rgba(20,0,40,.95)');
      coreGrad.addColorStop(1,'rgba(60,0,90,.4)');
      ctx.fillStyle=coreGrad;
      ctx.beginPath(); ctx.arc(0,0,ob.r*.45,0,Math.PI*2); ctx.fill();
      noGlow();
    }

    ctx.restore();
  }
}

// ── Particles ─────────────────────────────────
function drawParticles(){
  for(const p of particles){
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    glow(p.color, 10);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    noGlow();
    ctx.restore();
  }
}

// ── HUD ───────────────────────────────────────
function drawHUD(){
  // Score panel — top right
  const pad = 14, pw = 180, ph = 54;
  const px = BASE_W - pw - 10, py = 10;

  // Panel bg
  ctx.fillStyle='rgba(5,0,15,.7)';
  roundRect(ctx, px, py, pw, ph, 6);
  ctx.fill();
  ctx.strokeStyle='rgba(255,45,142,.5)';
  ctx.lineWidth=1.5;
  roundRect(ctx, px, py, pw, ph, 6);
  ctx.stroke();

  // Sliding gradient top
  glow('#ff2d8e',4);
  ctx.strokeStyle='#ff2d8e';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(px+6, py); ctx.lineTo(px+pw-6, py);
  ctx.stroke(); noGlow();

  ctx.fillStyle='rgba(255,45,142,.7)';
  ctx.font="bold 9px Nunito";
  ctx.textAlign='right';
  ctx.fillText('TIME SURVIVED', px+pw-pad, py+16);

  glow('#ff2d8e',10);
  ctx.fillStyle='#fff';
  ctx.font="bold 22px Bangers";
  ctx.letterSpacing='1px';
  ctx.fillText(score + 's', px+pw-pad, py+42);
  noGlow();

  // Best — top left
  ctx.fillStyle='rgba(200,150,255,.45)';
  ctx.font='bold 11px Nunito';
  ctx.textAlign='left';
  ctx.fillText('BEST: ' + bestScore + 's', 12, 24);

  // Speed level indicator
  const lvl = Math.floor(elapsed/10)+1;
  if(lvl>1){
    ctx.fillStyle='rgba(255,120,200,.5)';
    ctx.font='bold 10px Nunito';
    ctx.fillText('LVL ' + lvl, 12, 40);
  }

  // Close call flash
  if(closeCallTimer > 0){
    const a = closeCallTimer/.6;
    ctx.save();
    ctx.globalAlpha = a;
    glow('#ffd700', 20);
    ctx.fillStyle='#ffd700';
    ctx.font='bold 20px Bangers';
    ctx.textAlign='center';
    ctx.fillText('⚡ CLOSE CALL!', BASE_W/2, 50);
    noGlow();
    ctx.restore();
  }

  // Controls hint (fade after 5s)
  if(elapsed < 5){
    const a = Math.max(0, 1 - elapsed/4);
    ctx.save(); ctx.globalAlpha=a*.7;
    ctx.fillStyle='rgba(200,150,255,1)';
    ctx.font='bold 11px Nunito';
    ctx.textAlign='center';
    ctx.fillText('↑↓ arrows or move mouse to fly', BASE_W/2, BASE_H-18);
    ctx.restore();
  }
}

// ── Hitbox debug (off by default) ─────────────
// function drawHitboxes(){ ... }

// ── Round rect helper ─────────────────────────
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

// ── Near-miss flash overlay ───────────────────
function drawNearMissOverlay(){
  if(closeCallTimer>0){
    const a = (closeCallTimer/.6)*.06;
    ctx.fillStyle=`rgba(255,215,0,${a})`;
    ctx.fillRect(0,0,BASE_W,BASE_H);
  }
}

// ═══════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════
function loop(ts){
  if(state !== STATE.PLAYING && state !== STATE.DEAD) return;

  const dt = Math.min((ts - (lastTime||ts)) / 1000, .05);
  lastTime = ts;

  if(state === STATE.PLAYING) update(dt);

  // Shake
  let sx=0, sy=0;
  if(shakeTimer>0){
    sx = (Math.random()-.5)*shakeAmt;
    sy = (Math.random()-.5)*shakeAmt;
  }
  ctx.save();
  ctx.translate(sx, sy);

  drawBg();
  drawTrail();
  drawObstacles();
  drawParticles();
  if(!lana.dead) drawLana();
  drawNearMissOverlay();
  drawHUD();

  ctx.restore();

  if(state === STATE.PLAYING) requestAnimationFrame(loop);
  else if(state === STATE.DEAD){
    // Keep animating particles after death
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=.08; p.life-=p.decay;
      if(p.life<=0) particles.splice(i,1);
    }
    if(shakeTimer>0){ shakeTimer-=.016; shakeAmt*=.88; }
    if(particles.length>0) requestAnimationFrame(loop);
  }
}

// ═══════════════════════════════════════════════
//  GAME OVER UI
// ═══════════════════════════════════════════════
function showGameOver(){
  setTimeout(()=>{
    const goScreen = document.getElementById('gameOverScreen');
    goScreen.classList.remove('hidden');
    goScreen.classList.add('active');

    document.getElementById('goTime').textContent = 'TIME: ' + score + 's';
    document.getElementById('goBest').textContent = 'BEST: ' + bestScore + 's';

    const badge = document.getElementById('goBadge');
    if(score >= bestScore && score > 0){
      badge.style.display='inline-block';
    } else {
      badge.style.display='none';
    }
  }, 700);
}

// ═══════════════════════════════════════════════
//  IDLE ANIMATION ON START SCREEN
// ═══════════════════════════════════════════════
(function idleLoop(ts){
  if(state !== STATE.START){ return; }
  if(!bgStars){ makeBgStars(); makeBgBuildings(); }
  const dt = .016;
  for(const s of bgStars){ s.x-=s.speed*dt*60; if(s.x<0) s.x=BASE_W+5; s.bright+=s.blinkSpeed; }
  for(const b of bgBuildings){
    const dx=b.speed*dt*60; b.x-=dx;
    b.windows.forEach(w=>w.cx-=dx);
    if(b.x+b.w<0){
      const prev=bgBuildings.filter(bb=>bb.layer===b.layer).reduce((mx,bb)=>Math.max(mx,bb.x+bb.w),-999);
      const gap=Math.random()*12+4;
      const ddx=prev+gap-b.x;
      b.x=prev+gap;
      b.windows.forEach(w=>{ w.cx+=ddx; });
    }
  }
  drawBg();

  // Draw idle Lana centered
  if(!lana) lana={x:BASE_W*.14,y:BASE_H/2,vy:0,r:22,visualR:26,trail:[],angle:0,glowPhase:0,dead:false,nearMissFlash:0};
  lana.angle+=dt; lana.glowPhase+=dt*3;
  drawLana();

  requestAnimationFrame(idleLoop);
})();
</script>
