<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>BLACK vs ORANGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --black:#0a0010;
  --purple:#9b30ff;
  --orange:#ff7700;
  --gold:#ffcc00;
  --red:#ff2244;
  --green:#00ff88;
}
body{
  background:#000;
  font-family:'Nunito',sans-serif;
  overflow:hidden;
  width:100vw;height:100vh;
  display:flex;align-items:center;justify-content:center;
}

/* ── SETUP SCREEN ─────────────────────────── */
#setupScreen{
  position:fixed;inset:0;
  background:linear-gradient(160deg,#050010 0%,#0a0025 50%,#050010 100%);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:0;
  z-index:100;
  overflow:hidden;
}
/* binary rain bg */
#setupScreen::before{
  content:'';position:absolute;inset:0;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 24px,rgba(0,255,100,.03) 24px,rgba(0,255,100,.03) 25px),
    repeating-linear-gradient(90deg,transparent,transparent 24px,rgba(0,255,100,.02) 24px,rgba(0,255,100,.02) 25px);
  pointer-events:none;
}

.setup-title{
  font-family:'Bangers',cursive;
  font-size:clamp(2.8rem,8vw,6rem);
  letter-spacing:6px;
  text-align:center;
  line-height:1;
  margin-bottom:clamp(20px,3vh,40px);
  position:relative;z-index:1;
}
.setup-title .t-black{
  color:#cc88ff;
  text-shadow:0 0 15px #9b30ff,0 0 40px #9b30ff,3px 3px 0 #2a0050;
}
.setup-title .t-vs{
  color:#fff;font-size:.6em;
  text-shadow:0 0 10px #fff;
}
.setup-title .t-orange{
  color:#ff9900;
  text-shadow:0 0 15px #ff7700,0 0 40px #ff7700,3px 3px 0 #5a2200;
}

.players-row{
  display:flex;
  gap:clamp(12px,3vw,40px);
  align-items:stretch;
  position:relative;z-index:1;
  width:min(860px,94vw);
}

.player-panel{
  flex:1;
  border-radius:10px;
  padding:clamp(16px,2.5vw,28px) clamp(14px,2vw,24px);
  display:flex;flex-direction:column;gap:14px;
  position:relative;overflow:hidden;
}
.player-panel::before{
  content:'';position:absolute;inset:0;border-radius:10px;
  opacity:.08;
}
.panel-p1{
  background:rgba(100,0,200,.12);
  border:2px solid rgba(155,48,255,.5);
  box-shadow:0 0 30px rgba(155,48,255,.15),inset 0 0 20px rgba(155,48,255,.05);
}
.panel-p1::before{background:radial-gradient(circle at 30% 30%,#9b30ff,transparent);}
.panel-p2{
  background:rgba(200,80,0,.12);
  border:2px solid rgba(255,119,0,.5);
  box-shadow:0 0 30px rgba(255,119,0,.15),inset 0 0 20px rgba(255,119,0,.05);
}
.panel-p2::before{background:radial-gradient(circle at 70% 30%,#ff7700,transparent);}

.panel-label{
  font-family:'Bangers',cursive;
  font-size:clamp(1.1rem,2.5vw,1.6rem);
  letter-spacing:3px;
  text-transform:uppercase;
}
.panel-p1 .panel-label{color:#cc88ff;text-shadow:0 0 10px #9b30ff;}
.panel-p2 .panel-label{color:#ffaa44;text-shadow:0 0 10px #ff7700;}

.panel-controls{
  font-size:clamp(.62rem,1.4vw,.8rem);
  color:rgba(255,255,255,.35);
  letter-spacing:1px;
  line-height:1.7;
  margin-top:-4px;
}
.panel-controls strong{color:rgba(255,255,255,.55);}

.name-input{
  background:rgba(0,0,0,.4);
  border:2px solid rgba(255,255,255,.12);
  border-radius:6px;
  color:#fff;
  font-family:'Nunito',sans-serif;
  font-weight:700;
  font-size:clamp(.95rem,2vw,1.15rem);
  padding:10px 14px;
  outline:none;
  width:100%;
  transition:border-color .2s,box-shadow .2s;
}
.panel-p1 .name-input:focus{border-color:#9b30ff;box-shadow:0 0 14px rgba(155,48,255,.4);}
.panel-p2 .name-input:focus{border-color:#ff7700;box-shadow:0 0 14px rgba(255,119,0,.4);}
.name-input::placeholder{color:rgba(255,255,255,.25);}

.color-label{
  font-size:clamp(.72rem,1.5vw,.85rem);
  font-weight:700;
  color:rgba(255,255,255,.45);
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.color-options{display:flex;gap:10px;}
.color-btn{
  flex:1;
  font-family:'Bangers',cursive;
  font-size:clamp(.9rem,2vw,1.1rem);
  letter-spacing:2px;
  padding:9px 8px;
  border-radius:6px;
  border:2px solid transparent;
  cursor:pointer;
  transition:all .18s;
  background:rgba(0,0,0,.3);
  color:rgba(255,255,255,.5);
  position:relative;overflow:hidden;
}
.color-btn.black-btn{border-color:rgba(155,48,255,.3);}
.color-btn.orange-btn{border-color:rgba(255,119,0,.3);}
.color-btn.selected-black{
  background:rgba(155,48,255,.25);
  border-color:#9b30ff;
  color:#cc88ff;
  box-shadow:0 0 16px rgba(155,48,255,.4);
}
.color-btn.selected-orange{
  background:rgba(255,119,0,.25);
  border-color:#ff7700;
  color:#ffaa44;
  box-shadow:0 0 16px rgba(255,119,0,.4);
}
.color-btn.disabled-btn{
  opacity:.25;cursor:not-allowed;
  filter:grayscale(.8);
}

/* stickman preview inside button */
.btn-stick{display:inline-block;margin-right:6px;font-size:1em;vertical-align:middle;}

.vs-divider{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:6px;
  position:relative;z-index:1;
}
.vs-divider span{
  font-family:'Bangers',cursive;
  font-size:clamp(1.5rem,4vw,2.6rem);
  color:#fff;
  text-shadow:0 0 20px #fff,0 0 40px rgba(255,255,255,.3);
  letter-spacing:2px;
}
.vs-line{width:2px;height:clamp(20px,4vh,50px);background:linear-gradient(180deg,transparent,rgba(255,255,255,.3),transparent);}

.start-btn{
  font-family:'Bangers',cursive;
  font-size:clamp(1.4rem,3.5vw,2.2rem);
  letter-spacing:4px;
  color:#fff;
  background:linear-gradient(135deg,rgba(155,48,255,.3),rgba(255,119,0,.3));
  border:3px solid rgba(255,255,255,.3);
  border-radius:8px;
  padding:14px 50px;
  cursor:pointer;
  position:relative;z-index:1;
  margin-top:clamp(14px,2.5vh,28px);
  transition:all .2s;
  text-shadow:0 0 10px rgba(255,255,255,.5);
  box-shadow:0 0 30px rgba(155,48,255,.2),0 0 30px rgba(255,119,0,.2);
  animation:startPulse 1.8s ease-in-out infinite alternate;
}
.start-btn:hover{
  background:linear-gradient(135deg,rgba(155,48,255,.5),rgba(255,119,0,.5));
  border-color:rgba(255,255,255,.6);
  box-shadow:0 0 50px rgba(155,48,255,.4),0 0 50px rgba(255,119,0,.4);
  transform:scale(1.03);
}
@keyframes startPulse{
  from{box-shadow:0 0 20px rgba(155,48,255,.2),0 0 20px rgba(255,119,0,.2);}
  to  {box-shadow:0 0 50px rgba(155,48,255,.4),0 0 50px rgba(255,119,0,.4);}
}
.start-btn:disabled{opacity:.3;cursor:not-allowed;animation:none;transform:none;}

.error-msg{
  font-size:.82rem;font-weight:700;
  color:#ff4466;letter-spacing:1px;
  min-height:18px;text-align:center;
  position:relative;z-index:1;
}

/* ── GAME CANVAS ────────────────────────────── */
#gameCanvas{
  position:fixed;inset:0;
  display:none;
  width:100vw;height:100vh;
}

/* ── GAME OVER OVERLAY ─────────────────────── */
#gameOverScreen{
  position:fixed;inset:0;
  display:none;
  flex-direction:column;
  align-items:center;justify-content:center;
  gap:16px;
  z-index:200;
  background:rgba(0,0,5,.88);
}
.go-winner{
  font-family:'Bangers',cursive;
  font-size:clamp(2.5rem,8vw,6rem);
  letter-spacing:5px;
  text-align:center;
  line-height:1.1;
  animation:winnerPulse 1.4s ease-in-out infinite alternate;
}
@keyframes winnerPulse{
  from{filter:brightness(1);}
  to  {filter:brightness(1.4) drop-shadow(0 0 30px currentColor);}
}
.go-sub{
  font-family:'Nunito',sans-serif;font-weight:700;
  font-size:clamp(.85rem,2.5vw,1.3rem);
  letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,255,255,.5);
}
.go-btn{
  font-family:'Bangers',cursive;
  font-size:clamp(1.3rem,3vw,1.9rem);
  letter-spacing:3px;
  color:#fff;background:transparent;
  border:3px solid rgba(255,255,255,.4);
  border-radius:6px;padding:12px 40px;
  cursor:pointer;margin-top:10px;
  transition:all .2s;
}
.go-btn:hover{background:rgba(255,255,255,.1);border-color:#fff;transform:scale(1.04);}
</style>
</head>
<body>

<!-- ══ SETUP SCREEN ══════════════════════════ -->
<div id="setupScreen">
  <div class="setup-title">
    <span class="t-black">BLACK</span>
    <span class="t-vs"> VS </span>
    <span class="t-orange">ORANGE</span>
  </div>

  <div class="players-row">

    <!-- Player 1 -->
    <div class="player-panel panel-p1">
      <div class="panel-label">⬅ Player 1</div>
      <div class="panel-controls">
        <strong>W / S</strong> — move &nbsp;·&nbsp; <strong>SPACE</strong> — shoot
      </div>
      <input class="name-input" id="name1" placeholder="Enter your name…" maxlength="14" autocomplete="off"/>
      <div class="color-label">Choose your fighter</div>
      <div class="color-options">
        <button class="color-btn black-btn" id="p1black" onclick="pickColor(1,'black')">
          <span class="btn-stick">◉</span> BLACK
        </button>
        <button class="color-btn orange-btn" id="p1orange" onclick="pickColor(1,'orange')">
          <span class="btn-stick">◉</span> ORANGE
        </button>
      </div>
    </div>

    <div class="vs-divider">
      <div class="vs-line"></div>
      <span>VS</span>
      <div class="vs-line"></div>
    </div>

    <!-- Player 2 -->
    <div class="player-panel panel-p2">
      <div class="panel-label">Player 2 ➡</div>
      <div class="panel-controls">
        <strong>↑ / ↓</strong> — move &nbsp;·&nbsp; <strong>ENTER</strong> — shoot
      </div>
      <input class="name-input" id="name2" placeholder="Enter your name…" maxlength="14" autocomplete="off"/>
      <div class="color-label">Choose your fighter</div>
      <div class="color-options">
        <button class="color-btn black-btn" id="p2black" onclick="pickColor(2,'black')">
          <span class="btn-stick">◉</span> BLACK
        </button>
        <button class="color-btn orange-btn" id="p2orange" onclick="pickColor(2,'orange')">
          <span class="btn-stick">◉</span> ORANGE
        </button>
      </div>
    </div>

  </div>

  <div class="error-msg" id="errMsg"></div>
  <button class="start-btn" id="startBtn" onclick="tryStart()">⚔ START BATTLE</button>
</div>

<!-- ══ GAME CANVAS ════════════════════════════ -->
<canvas id="gameCanvas"></canvas>

<!-- ══ GAME OVER ══════════════════════════════ -->
<div id="gameOverScreen">
  <div class="go-winner" id="goWinner">PLAYER 1 WINS!</div>
  <div class="go-sub" id="goSub">SHADOW MAGIC REIGNS SUPREME</div>
  <button class="go-btn" onclick="backToSetup()">↺ PLAY AGAIN</button>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  COLOR SELECTION LOGIC
//  Default: P1=black, P2=orange — always ready to start
// ═══════════════════════════════════════════════════════
const choices = {1: 'black', 2: 'orange'};

function pickColor(player, color){
  const other = player === 1 ? 2 : 1;
  // Swap the other player's color if it conflicts
  if(choices[other] === color){
    choices[other] = choices[player] === color ? (color==='black'?'orange':'black') : choices[player];
    updateColorUI(other);
  }
  choices[player] = color;
  updateColorUI(player);
  updateColorUI(other);
  document.getElementById('errMsg').textContent = '';
}

function updateColorUI(player){
  const color  = choices[player];
  const other  = player === 1 ? 2 : 1;
  const bBlack  = document.getElementById(`p${player}black`);
  const bOrange = document.getElementById(`p${player}orange`);

  bBlack.className  = 'color-btn black-btn';
  bOrange.className = 'color-btn orange-btn';

  if(color === 'black')  bBlack.classList.add('selected-black');
  if(color === 'orange') bOrange.classList.add('selected-orange');

  // Visually dim (but still clickable) the color the other player owns
  if(choices[other] === 'black')  bBlack.classList.add('disabled-btn');
  if(choices[other] === 'orange') bOrange.classList.add('disabled-btn');
}

// Apply defaults on load
window.addEventListener('DOMContentLoaded', () => {
  updateColorUI(1);
  updateColorUI(2);
});

// ═══════════════════════════════════════════════════════
//  START / SETUP
// ═══════════════════════════════════════════════════════
let p1Config = {}, p2Config = {};

function tryStart(){
  const n1 = document.getElementById('name1').value.trim() || 'Player 1';
  const n2 = document.getElementById('name2').value.trim() || 'Player 2';
  const err = document.getElementById('errMsg');

  if(!choices[1] || !choices[2]){
    err.textContent = '⚠ Both players must choose a fighter!';
    return;
  }

  p1Config = {name: n1, color: choices[1]};
  p2Config = {name: n2, color: choices[2]};

  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('gameCanvas').style.display  = 'block';
  initGame();
}

function backToSetup(){
  document.getElementById('gameOverScreen').style.display = 'none';
  document.getElementById('setupScreen').style.display    = 'flex';
  document.getElementById('gameCanvas').style.display     = 'none';
  running = false;
}

// ═══════════════════════════════════════════════════════
//  GAME ENGINE
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

let W, H, running = false;
let players, missiles, particles, bgBits, bgBlocks;
let shakeTimer = 0, shakeAmt = 0, shakeSx = 0, shakeSy = 0;
let keys = {};
let lastTime = null;

// Colour palettes
const PALETTE = {
  black: {
    body:     '#1a0030',
    outline:  '#cc88ff',
    glow:     '#9b30ff',
    missile:  '#dd55ff',
    mGlow:    '#9b30ff',
    heart:    '#cc88ff',
    aura:     'rgba(155,48,255,',
    tag:      '#cc88ff'
  },
  orange: {
    body:     '#ff7700',
    outline:  '#ffcc00',
    glow:     '#ff9900',
    missile:  '#ff9922',
    mGlow:    '#ff6600',
    heart:    '#ffaa44',
    aura:     'rgba(255,119,0,',
    tag:      '#ffcc44'
  }
};

// ── Resize ──────────────────────────────────
function resize(){
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  if(players){
    players[0].x = W * .1;
    players[1].x = W * .9;
    players[0].y = Math.min(players[0].y, H - 60);
    players[1].y = Math.min(players[1].y, H - 60);
  }
}
window.addEventListener('resize', resize);

// ── Keys ────────────────────────────────────
window.addEventListener('keydown', e => {
  // Don't intercept keys while typing in a name input
  if(e.target.tagName === 'INPUT') return;
  keys[e.code] = true;
  if(['Space','ArrowUp','ArrowDown','Enter'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => {
  if(e.target.tagName === 'INPUT') return;
  keys[e.code] = false;
});

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
function initGame(){
  resize();
  running = true;
  shakeTimer = 0;

  const LIVES = 3;

  players = [
    {
      x: W * .1, y: H / 2,
      vy: 0,
      lives: LIVES,
      hitTimer: 0,
      shootCooldown: 0,
      facing: 1,      // 1 = right
      bobAngle: 0,
      auraPhase: 0,
      dead: false,
      config: p1Config,
      pal: PALETTE[p1Config.color],
      controls: {up:'KeyW', down:'KeyS', shoot:'Space'},
      shootSfx: 0
    },
    {
      x: W * .9, y: H / 2,
      vy: 0,
      lives: LIVES,
      hitTimer: 0,
      shootCooldown: 0,
      facing: -1,     // -1 = left
      bobAngle: Math.PI,
      auraPhase: 1,
      dead: false,
      config: p2Config,
      pal: PALETTE[p2Config.color],
      controls: {up:'ArrowUp', down:'ArrowDown', shoot:'Enter'},
      shootSfx: 0
    }
  ];

  missiles    = [];
  particles   = [];
  makeBgBits();
  makeBgBlocks();

  lastTime = null;
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════
//  BACKGROUND
// ═══════════════════════════════════════════════════════
function makeBgBits(){
  bgBits = [];
  const chars = '01アイウエオカキク10サシスセソタチ01';
  for(let i=0;i<90;i++){
    bgBits.push({
      x: Math.random()*2000,  // logical col
      y: Math.random()*1000,
      speed: Math.random()*40+15,
      char: chars[Math.floor(Math.random()*chars.length)],
      alpha: Math.random()*.5+.1,
      size: Math.random()*6+9,
      color: Math.random()<.6 ? '#00ff66' : (Math.random()<.5?'#9b30ff':'#ff7700')
    });
  }
}

function makeBgBlocks(){
  bgBlocks = [];
  const blockSize = 28;
  const cols = Math.ceil(2400/blockSize);
  const rows = 4;
  const baseY = 0; // relative to H, placed at bottom in draw
  for(let c=0;c<cols;c++){
    for(let r=0;r<rows;r++){
      const type = Math.random();
      bgBlocks.push({
        col: c, row: r,
        type: type<.5?'dirt': type<.8?'stone':'ore',
        size: blockSize
      });
    }
  }
}

function drawBg(){
  // Sky
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#020010');
  sky.addColorStop(.5,'#050020');
  sky.addColorStop(1,'#0a0030');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);

  // Purple-orange gradient atmosphere between players
  const atmo = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.6);
  atmo.addColorStop(0,'rgba(80,0,120,.08)');
  atmo.addColorStop(.5,'rgba(120,40,0,.05)');
  atmo.addColorStop(1,'transparent');
  ctx.fillStyle=atmo; ctx.fillRect(0,0,W,H);

  // Binary rain
  ctx.save();
  for(const b of bgBits){
    ctx.font = `${b.size}px monospace`;
    ctx.fillStyle = b.color;
    ctx.globalAlpha = b.alpha;
    const px = (b.x % W);
    ctx.fillText(b.char, px, b.y % H);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // Pixel blocks at bottom
  const bs = Math.max(20, Math.floor(W/40));
  const floorH = bs*4;
  const floorY = H - floorH;
  const cols2 = Math.ceil(W/bs)+1;
  for(let c=0;c<cols2;c++){
    for(let r=0;r<4;r++){
      const idx = (c + r*11) % bgBlocks.length;
      const blk = bgBlocks[idx];
      let fill, stroke;
      if(blk.type==='dirt')  { fill='#3d1f00'; stroke='#5a3010'; }
      else if(blk.type==='stone'){ fill='#1a1a2e'; stroke='#2a2a45'; }
      else                       { fill='#0f1a10'; stroke='#1a3020'; }
      ctx.fillStyle = fill;
      ctx.fillRect(c*bs, floorY+r*bs, bs-1, bs-1);
      ctx.strokeStyle = stroke;
      ctx.lineWidth=1;
      ctx.strokeRect(c*bs, floorY+r*bs, bs-1, bs-1);

      // ore glint
      if(blk.type==='ore'){
        ctx.fillStyle='rgba(0,255,136,.35)';
        ctx.fillRect(c*bs+bs*.3, floorY+r*bs+bs*.3, bs*.25, bs*.25);
      }
    }
  }

  // Floor glow
  const fg = ctx.createLinearGradient(0,floorY-20,0,floorY+10);
  fg.addColorStop(0,'transparent');
  fg.addColorStop(1,'rgba(155,48,255,.15)');
  ctx.fillStyle=fg;
  ctx.fillRect(0,floorY-20,W,30);
}

function updateBg(dt){
  for(const b of bgBits){
    b.y += b.speed * dt;
    if(b.y > H+20){ b.y=-20; b.x=Math.random()*W; }
    b.alpha = .08 + .12*Math.abs(Math.sin(b.y*.04));
  }
}

// ═══════════════════════════════════════════════════════
//  STICKMAN DRAW
// ═══════════════════════════════════════════════════════
function drawStickman(p){
  const x = p.x, y = p.y;
  const pal = p.pal;
  const bob = Math.sin(p.bobAngle)*4;
  const isBlack = p.config.color === 'black';

  // Hit flash
  if(p.hitTimer > 0){
    ctx.save();
    ctx.globalAlpha = Math.sin(p.hitTimer*20)*.5+.5;
  }

  ctx.save();
  ctx.translate(x, y+bob);
  ctx.scale(p.facing, 1);

  const R = Math.max(14, Math.min(22, W/60)); // head radius scales w/ screen

  // ── AURA / GLOW RINGS ──────────────────────
  const ap = .4+.3*Math.sin(p.auraPhase);
  ctx.save();
  for(let ring=3;ring>0;ring--){
    ctx.beginPath();
    ctx.arc(0,-R*.6, R*(.8+ring*.55),0,Math.PI*2);
    ctx.strokeStyle = pal.aura+(ap*.07*ring)+')';
    ctx.lineWidth = ring*4;
    ctx.stroke();
  }
  ctx.restore();

  if(isBlack){
    // Shadow swirl
    ctx.save();
    ctx.rotate(p.auraPhase*.4);
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.arc(0,-R*.6, R*(1.1+i*.4), i*(Math.PI*2/3), i*(Math.PI*2/3)+Math.PI*1.2);
      ctx.strokeStyle=`rgba(155,48,255,${.15+.05*i})`;
      ctx.lineWidth=3;
      ctx.stroke();
    }
    ctx.restore();
  } else {
    // Ninja speed lines
    ctx.save();
    for(let i=0;i<4;i++){
      const a = (i/4)*Math.PI*2 + p.auraPhase*.3;
      const d = R*1.5;
      ctx.strokeStyle=`rgba(255,180,0,${.12+.05*Math.sin(p.auraPhase+i)})`;
      ctx.lineWidth=2.5;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*d, Math.sin(a)*d - R*.6);
      ctx.lineTo(Math.cos(a)*(d+R*.5), Math.sin(a)*(d+R*.5) - R*.6);
      ctx.stroke();
    }
    ctx.restore();
  }

  const LW = Math.max(4, R*.45); // limb width

  // Helper: set glow stroke
  const setGlow = (color, blur) => {
    ctx.shadowColor = color; ctx.shadowBlur = blur;
    ctx.strokeStyle = color; ctx.lineWidth = LW;
    ctx.lineCap = 'round';
  };
  const setFill = (color, blur) => {
    ctx.shadowColor = color; ctx.shadowBlur = blur;
    ctx.fillStyle = color;
  };

  // ── BODY ───────────────────────────────────
  setGlow(pal.glow, 14);
  ctx.beginPath();
  ctx.moveTo(0, -R+R*.1);
  ctx.lineTo(0, R*1.8);
  ctx.stroke();

  // ── ARMS ───────────────────────────────────
  const armY = -R*.25;
  setGlow(pal.glow, 14);
  // Back arm
  ctx.beginPath(); ctx.moveTo(0,armY); ctx.lineTo(-R*1.3, armY+R*.5); ctx.stroke();
  // Front arm (pointing forward = "shooting" pose slight angle)
  ctx.beginPath(); ctx.moveTo(0,armY); ctx.lineTo(R*1.4, armY-R*.2); ctx.stroke();

  // ── LEGS ───────────────────────────────────
  const legY = R*1.8;
  const legSplay = Math.sin(p.bobAngle*2)*.2;
  ctx.beginPath(); ctx.moveTo(0,legY); ctx.lineTo(-R*.9-legSplay*R,legY+R*1.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,legY); ctx.lineTo( R*.9+legSplay*R,legY+R*1.5); ctx.stroke();

  // ── HEAD ───────────────────────────────────
  ctx.shadowColor = pal.glow; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.arc(0,-R, R, 0, Math.PI*2);
  if(isBlack){
    ctx.fillStyle='#0a0015';
    ctx.fill();
    ctx.strokeStyle=pal.outline; ctx.lineWidth=LW*.6; ctx.stroke();
  } else {
    ctx.fillStyle=pal.body;
    ctx.fill();
    ctx.strokeStyle=pal.outline; ctx.lineWidth=LW*.5; ctx.stroke();
  }

  // ── EYES ───────────────────────────────────
  ctx.shadowColor=pal.glow; ctx.shadowBlur=8;
  ctx.fillStyle=pal.outline;
  if(isBlack){
    // Glowing purple eyes
    ctx.beginPath(); ctx.arc(R*.3,-R, R*.22,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(R*.34,-R-.02, R*.08,0,Math.PI*2); ctx.fill();
  } else {
    // Orange eyes, determined look
    ctx.beginPath(); ctx.arc(R*.3,-R+.05,R*.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(R*.34,-R-.02,R*.08,0,Math.PI*2); ctx.fill();
    // Ninja headband
    ctx.strokeStyle=pal.outline; ctx.lineWidth=R*.2; ctx.shadowBlur=6;
    ctx.beginPath();
    ctx.moveTo(-R*.7,-R*.5);
    ctx.lineTo( R*.7,-R*.5);
    ctx.stroke();
  }

  ctx.shadowBlur=0;
  ctx.restore();

  if(p.hitTimer>0){ ctx.restore(); }

  // ── NAME TAG ───────────────────────────────
  ctx.save();
  ctx.font = `bold ${Math.max(11,Math.min(16,W/80))}px Nunito`;
  ctx.textAlign='center';
  ctx.fillStyle=pal.tag;
  ctx.shadowColor=pal.glow; ctx.shadowBlur=8;
  ctx.fillText(p.config.name, x, y - R*2.8 - Math.max(14,R));
  ctx.shadowBlur=0;
  ctx.restore();
}

// ═══════════════════════════════════════════════════════
//  HUD
// ═══════════════════════════════════════════════════════
function drawHUD(){
  const HS = Math.max(14, Math.min(22, W/55));

  // P1 hearts - top left
  for(let i=0;i<3;i++){
    const alive = i < players[0].lives;
    ctx.font=`${HS}px Nunito`;
    ctx.textAlign='left';
    ctx.shadowColor=alive?players[0].pal.glow:'#333';
    ctx.shadowBlur=alive?10:0;
    ctx.fillStyle=alive?players[0].pal.heart:'#2a1a1a';
    ctx.fillText('♥', 14+i*(HS+5), 30+HS*.5);
  }
  ctx.shadowBlur=0;
  ctx.fillStyle=players[0].pal.tag;
  ctx.font=`bold ${Math.max(10,Math.min(14,W/90))}px Nunito`;
  ctx.fillText(players[0].config.name.toUpperCase(), 14, 24);

  // P2 hearts - top right
  for(let i=0;i<3;i++){
    const alive = i < players[1].lives;
    ctx.font=`${HS}px Nunito`;
    ctx.textAlign='right';
    ctx.shadowColor=alive?players[1].pal.glow:'#333';
    ctx.shadowBlur=alive?10:0;
    ctx.fillStyle=alive?players[1].pal.heart:'#2a1a1a';
    ctx.fillText('♥', W-14-(2-i)*(HS+5), 30+HS*.5);
  }
  ctx.shadowBlur=0;
  ctx.fillStyle=players[1].pal.tag;
  ctx.font=`bold ${Math.max(10,Math.min(14,W/90))}px Nunito`;
  ctx.textAlign='right';
  ctx.fillText(players[1].config.name.toUpperCase(), W-14, 24);

  // Center divider
  ctx.strokeStyle='rgba(255,255,255,.06)';
  ctx.lineWidth=1;
  ctx.setLineDash([8,8]);
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();
  ctx.setLineDash([]);

  // Controls reminder (fade after 5s)
  if(gameTime < 6){
    const a = Math.max(0,1-gameTime/5)*.5;
    ctx.save(); ctx.globalAlpha=a;
    ctx.fillStyle='rgba(255,255,255,1)';
    ctx.font=`bold ${Math.max(9,Math.min(12,W/100))}px Nunito`;
    ctx.textAlign='left';
    ctx.fillText('W/S move  ·  SPACE shoot', 14, H-16);
    ctx.textAlign='right';
    ctx.fillText('↑/↓ move  ·  ENTER shoot', W-14, H-16);
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════
//  MISSILES
// ═══════════════════════════════════════════════════════
function spawnMissile(player){
  const pal = player.pal;
  const dir = player.facing;
  missiles.push({
    x: player.x + dir*28,
    y: player.y - 4,
    vx: dir * Math.max(420, W*.55),
    owner: player,
    pal,
    r: Math.max(7, W/130),
    phase: 0,
    trail: [],
    isBlack: player.config.color==='black'
  });
}

function drawMissiles(){
  for(const m of missiles){
    // Trail
    for(let i=0;i<m.trail.length;i++){
      const t=m.trail[i];
      if(t.life<=0) continue;
      ctx.save();
      ctx.globalAlpha=t.life*.5;
      ctx.beginPath();
      ctx.arc(t.x,t.y,m.r*t.life*.8,0,Math.PI*2);
      ctx.fillStyle=m.pal.missile;
      ctx.shadowColor=m.pal.mGlow; ctx.shadowBlur=8;
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(m.x, m.y);

    if(m.isBlack){
      // Shadow orb
      const pulse=.7+.3*Math.sin(m.phase*6);
      const grad=ctx.createRadialGradient(0,0,0,0,0,m.r*1.4);
      grad.addColorStop(0,'#fff');
      grad.addColorStop(.3,'#ee88ff');
      grad.addColorStop(.7,'#9b30ff');
      grad.addColorStop(1,'transparent');
      ctx.shadowColor='#9b30ff'; ctx.shadowBlur=20*pulse;
      ctx.fillStyle=grad;
      ctx.beginPath(); ctx.arc(0,0,m.r*1.4,0,Math.PI*2); ctx.fill();
      // Rotating ring
      ctx.rotate(m.phase*3);
      ctx.strokeStyle=`rgba(200,100,255,${.5*pulse})`;
      ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,m.r*1.8,0,Math.PI*2); ctx.stroke();
    } else {
      // Orange fire bolt
      const pulse=.8+.2*Math.sin(m.phase*8);
      const grad=ctx.createRadialGradient(0,0,0,0,0,m.r*1.6);
      grad.addColorStop(0,'#fff');
      grad.addColorStop(.25,'#ffee44');
      grad.addColorStop(.6,'#ff7700');
      grad.addColorStop(1,'transparent');
      ctx.shadowColor='#ff7700'; ctx.shadowBlur=22*pulse;
      ctx.fillStyle=grad;
      ctx.beginPath(); ctx.arc(0,0,m.r*1.3,0,Math.PI*2); ctx.fill();
      // Flame spikes
      ctx.shadowColor='#ffcc00'; ctx.shadowBlur=10;
      ctx.fillStyle='rgba(255,220,0,.6)';
      for(let s=0;s<5;s++){
        const sa=(s/5)*Math.PI*2+m.phase*2;
        ctx.beginPath();
        ctx.arc(Math.cos(sa)*m.r*1.1, Math.sin(sa)*m.r*1.1, m.r*.4,0,Math.PI*2);
        ctx.fill();
      }
    }
    ctx.shadowBlur=0;
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════════════════════
function spawnHitParticles(x,y,pal){
  for(let i=0;i<35;i++){
    const a=Math.random()*Math.PI*2;
    const spd=Math.random()*9+3;
    particles.push({
      x,y,
      vx:Math.cos(a)*spd, vy:Math.sin(a)*spd-3,
      life:1, decay:Math.random()*.025+.015,
      r:Math.random()*6+3,
      color: Math.random()<.6 ? pal.missile : (Math.random()<.5?'#fff':pal.glow)
    });
  }
}

function spawnTrailParticle(m){
  m.trail.push({x:m.x,y:m.y,life:1});
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=.15;
    p.life-=p.decay;
    if(p.life<=0) particles.splice(i,1);
  }
  for(const m of missiles){
    if(Math.random()<.6) spawnTrailParticle(m);
    for(let i=m.trail.length-1;i>=0;i--){
      m.trail[i].life-=.07;
      if(m.trail[i].life<=0) m.trail.splice(i,1);
    }
  }
}

function drawParticles(){
  for(const p of particles){
    ctx.save();
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.shadowColor=p.color; ctx.shadowBlur=10;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════════════
const SPEED   = 320;
const FLOOR_MARGIN = 60;
let gameTime = 0;

function update(dt){
  gameTime += dt;

  // Scroll background bits
  updateBg(dt);

  // ── Players ────────────────────────────────
  for(const p of players){
    p.bobAngle  += dt*2.5;
    p.auraPhase += dt*2.8;
    if(p.hitTimer>0) p.hitTimer-=dt;
    if(p.shootCooldown>0) p.shootCooldown-=dt;

    if(p.dead) continue;

    const ctrl = p.controls;
    if(keys[ctrl.up])   p.vy -= SPEED*dt*2.2;
    if(keys[ctrl.down]) p.vy += SPEED*dt*2.2;
    p.vy *= .80;
    p.y  += p.vy*dt;

    const floorY = H - FLOOR_MARGIN - Math.max(14,Math.min(22,W/60))*2.5;
    const ceilY  = Math.max(14,Math.min(22,W/60))*4;
    p.y = Math.max(ceilY, Math.min(floorY, p.y));

    // Shoot
    if(keys[ctrl.shoot] && p.shootCooldown<=0){
      spawnMissile(p);
      p.shootCooldown=.6;
      keys[ctrl.shoot]=false; // consume key press so one tap = one shot
    }
  }

  // ── Missiles ───────────────────────────────
  for(let i=missiles.length-1;i>=0;i--){
    const m=missiles[i];
    m.x+=m.vx*dt;
    m.phase+=dt;

    // Off screen
    if(m.x<-60||m.x>W+60){ missiles.splice(i,1); continue; }

    // Collision
    let hit=false;
    for(const p of players){
      if(p===m.owner||p.dead||p.hitTimer>0) continue;
      const dx=p.x-m.x, dy=p.y-m.y;
      const hitR = m.r + Math.max(14,Math.min(22,W/60))*.85;
      if(dx*dx+dy*dy < hitR*hitR){
        p.lives--;
        p.hitTimer=.8;
        spawnHitParticles(m.x,m.y,m.pal);
        shakeTimer=.45; shakeAmt=14;
        missiles.splice(i,1);
        hit=true;
        if(p.lives<=0){
          p.dead=true;
          setTimeout(()=>showGameOver(p),600);
        }
        break;
      }
    }
    if(!hit) updateParticles(0); // trail update handled below
  }

  updateParticles(dt);

  // ── Shake ──────────────────────────────────
  if(shakeTimer>0){
    shakeTimer-=dt; shakeAmt*=.88;
    shakeSx=(Math.random()-.5)*shakeAmt;
    shakeSy=(Math.random()-.5)*shakeAmt;
  } else { shakeSx=0; shakeSy=0; }
}

// ═══════════════════════════════════════════════════════
//  GAME OVER
// ═══════════════════════════════════════════════════════
function showGameOver(loser){
  running=false;
  const winner = players.find(p=>p!==loser);
  const isBlack = winner.config.color==='black';
  const goScreen = document.getElementById('gameOverScreen');
  const goWinner = document.getElementById('goWinner');
  const goSub    = document.getElementById('goSub');

  goWinner.textContent = winner.config.name.toUpperCase() + ' WINS!';
  goWinner.style.color = isBlack ? '#cc88ff' : '#ffaa44';
  goSub.textContent    = isBlack
    ? '"SHADOWS ARE MY POWER. COURAGE IS MY CODE."'
    : '"NINJA. CODE. VICTORY."';

  goScreen.style.display='flex';
}

// ═══════════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════════
function loop(ts){
  if(!running) return;

  const dt = Math.min((ts-(lastTime||ts))/1000,.05);
  lastTime=ts;

  update(dt);

  ctx.save();
  ctx.translate(shakeSx, shakeSy);

  drawBg();
  drawParticles();
  drawMissiles();
  for(const p of players) if(!p.dead) drawStickman(p);
  drawHUD();

  ctx.restore();

  requestAnimationFrame(loop);
}
</script>
