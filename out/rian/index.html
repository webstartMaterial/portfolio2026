<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>LEGO Justice League</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f5e642;font-family:'Nunito',sans-serif;overflow:hidden;width:100vw;height:100vh;}

/* ── SELECT SCREEN ─────────────────────── */
#selectScreen{
  position:fixed;inset:0;
  background:linear-gradient(180deg,#ffe033 0%,#fff176 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:24px;z-index:10;padding:20px;
}
.sel-title{
  font-family:'Bangers',cursive;
  font-size:clamp(2.5rem,7vw,5rem);
  letter-spacing:5px;color:#1a1a1a;
  text-shadow:4px 4px 0 #e6b800,6px 6px 0 rgba(0,0,0,.2);
  text-align:center;line-height:1;
}
.sel-sub{
  font-size:clamp(.85rem,2vw,1.1rem);font-weight:700;
  color:#444;letter-spacing:2px;text-transform:uppercase;
  text-align:center;
}
.cards-row{
  display:flex;gap:clamp(8px,2vw,18px);
  flex-wrap:nowrap;overflow-x:auto;
  max-width:100%;padding:8px 4px;
  scrollbar-width:thin;
}
.card{
  flex:0 0 clamp(110px,18vw,155px);
  background:#fff;
  border:4px solid #ccc;
  border-radius:12px;
  padding:clamp(10px,2vw,18px) clamp(8px,1.5vw,14px);
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:transform .15s,border-color .15s,box-shadow .15s;
  user-select:none;
}
.card:hover{transform:translateY(-6px);box-shadow:0 10px 24px rgba(0,0,0,.18);}
.card.selected{border-color:#333;box-shadow:0 0 0 4px #333,0 8px 24px rgba(0,0,0,.25);transform:translateY(-8px);}
.card canvas{border-radius:8px;}
.card-name{font-family:'Bangers',cursive;font-size:clamp(1rem,2.5vw,1.4rem);letter-spacing:2px;text-align:center;}
.card-power{font-size:clamp(.6rem,1.5vw,.75rem);font-weight:700;color:#666;text-align:center;line-height:1.4;text-transform:uppercase;letter-spacing:.5px;}

.play-btn{
  font-family:'Bangers',cursive;font-size:clamp(1.4rem,4vw,2.4rem);
  letter-spacing:4px;color:#fff;
  background:#e63030;border:4px solid #900;
  border-radius:10px;padding:12px 50px;cursor:pointer;
  box-shadow:0 6px 0 #700,0 8px 20px rgba(0,0,0,.3);
  transition:transform .1s,box-shadow .1s;
}
.play-btn:hover{transform:translateY(2px);box-shadow:0 4px 0 #700;}
.play-btn:disabled{background:#aaa;border-color:#777;box-shadow:0 4px 0 #555;cursor:not-allowed;}

/* ── CANVAS ────────────────────────────── */
#gameCanvas{position:fixed;inset:0;display:none;}

/* ── OVERLAY SCREENS ──────────────────── */
.overlay{
  position:fixed;inset:0;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  gap:20px;z-index:20;
}
#winScreen{background:linear-gradient(160deg,#ffe033,#fff176);}
#loseScreen{background:linear-gradient(160deg,#4a0080,#800080);}
.ov-title{font-family:'Bangers',cursive;font-size:clamp(3rem,10vw,7rem);letter-spacing:5px;text-align:center;line-height:1;}
.ov-sub{font-family:'Nunito',sans-serif;font-weight:700;font-size:clamp(.9rem,2.5vw,1.4rem);letter-spacing:2px;text-align:center;}
.ov-btn{
  font-family:'Bangers',cursive;font-size:clamp(1.2rem,3vw,2rem);
  letter-spacing:3px;color:#fff;background:#e63030;
  border:3px solid #900;border-radius:8px;padding:12px 40px;
  cursor:pointer;transition:transform .1s;
}
.ov-btn:hover{transform:scale(1.05);}
</style>
</head>
<body>

<!-- SELECT SCREEN -->
<div id="selectScreen">
  <div class="sel-title">⚡ LEGO JUSTICE LEAGUE ⚡</div>
  <div class="sel-sub">Joker stole the city's gold — choose your hero!</div>
  <div class="cards-row" id="cardsRow"></div>
  <button class="play-btn" id="playBtn" disabled onclick="startGame()">▶ LET'S GO!</button>
</div>

<!-- GAME CANVAS -->
<canvas id="gameCanvas"></canvas>

<!-- WIN -->
<div class="overlay" id="winScreen">
  <div class="ov-title" style="color:#1a1a1a">🏆 CITY SAVED! 🏆</div>
  <div class="ov-sub" style="color:#444" id="winSub">All gold recovered!</div>
  <button class="ov-btn" onclick="location.reload()">↺ PLAY AGAIN</button>
</div>

<!-- LOSE -->
<div class="overlay" id="loseScreen">
  <div class="ov-title" style="color:#ffe033">😈 JOKER WINS!</div>
  <div class="ov-sub" style="color:#ffccff" id="loseSub">The city is lost...</div>
  <button class="ov-btn" onclick="location.reload()">↺ TRY AGAIN</button>
</div>

<script>
// ═══════════════════════════════════════════════
//  CHARACTERS
// ═══════════════════════════════════════════════
const HEROES = [
  { id:'batman',  name:'BATMAN',        bodyColor:'#2a2a2a', capeColor:'#1a1a1a', accentColor:'#f5e642', power:'Batarang', powerDesc:'Press X to\nthrow batarang', speed:1,   jumpMult:1   },
  { id:'superman',name:'SUPERMAN',      bodyColor:'#1565c0', capeColor:'#c62828', accentColor:'#f5e642', power:'Fly',      powerDesc:'Double jump\n+ hold SPACE', speed:1,   jumpMult:1.2 },
  { id:'gl',      name:'GREEN\nLANTERN',bodyColor:'#2e7d32', capeColor:'#1b5e20', accentColor:'#69ff47', power:'Shield',   powerDesc:'Press X for\ninvincibility', speed:1,   jumpMult:1   },
  { id:'flash',   name:'FLASH',         bodyColor:'#c62828', capeColor:'#b71c1c', accentColor:'#f5e642', power:'Speed',    powerDesc:'Press X for\nsuper dash',     speed:1.8, jumpMult:1   },
  { id:'joker',   name:'JOKER',         bodyColor:'#6a1b9a', capeColor:'#4a0072', accentColor:'#69ff47', power:'Chaos',    powerDesc:'Press X to\nconfuse enemies',  speed:1,   jumpMult:1   },
];

let selectedHero = null;

// ── Draw mini LEGO figure on card canvas ──
function drawCardFigure(canvas, hero){
  const c = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  c.clearRect(0,0,w,h);

  const cx = w/2;
  const scale = w/80;

  // Cape/back
  c.fillStyle = hero.capeColor;
  c.beginPath();
  c.moveTo(cx-14*scale, 20*scale);
  c.bezierCurveTo(cx-20*scale,28*scale, cx-18*scale,55*scale, cx-12*scale,62*scale);
  c.lineTo(cx+12*scale,62*scale);
  c.bezierCurveTo(cx+18*scale,55*scale, cx+20*scale,28*scale, cx+14*scale,20*scale);
  c.fill();

  // Body
  c.fillStyle = hero.bodyColor;
  roundRect(c, cx-13*scale, 20*scale, 26*scale, 28*scale, 4*scale);
  c.fill();

  // Logo / accent
  c.fillStyle = hero.accentColor;
  c.beginPath();
  c.arc(cx, 34*scale, 6*scale, 0, Math.PI*2);
  c.fill();

  // Neck
  c.fillStyle = '#f5c518';
  c.fillRect(cx-5*scale, 14*scale, 10*scale, 8*scale);

  // Head
  c.fillStyle = '#f5c518';
  roundRect(c, cx-14*scale, -2*scale, 28*scale, 18*scale, 5*scale);
  c.fill();

  // Stud on head
  c.fillStyle = '#e6b800';
  c.beginPath(); c.arc(cx, -4*scale, 5*scale, 0, Math.PI*2); c.fill();

  // Eyes
  c.fillStyle = '#1a1a1a';
  c.beginPath(); c.arc(cx-5*scale, 7*scale, 2.5*scale,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(cx+5*scale, 7*scale, 2.5*scale,0,Math.PI*2); c.fill();

  // Smile
  c.strokeStyle='#1a1a1a'; c.lineWidth=1.5*scale; c.lineCap='round';
  c.beginPath(); c.arc(cx, 9*scale, 5*scale, 0.2, Math.PI-.2); c.stroke();

  // Mask/accessory per hero
  if(hero.id==='batman'){
    c.fillStyle='#1a1a1a';
    // Bat ears
    c.beginPath(); c.moveTo(cx-10*scale,-2*scale); c.lineTo(cx-14*scale,-12*scale); c.lineTo(cx-5*scale,-2*scale); c.fill();
    c.beginPath(); c.moveTo(cx+10*scale,-2*scale); c.lineTo(cx+14*scale,-12*scale); c.lineTo(cx+5*scale,-2*scale); c.fill();
    // Eye mask
    c.fillRect(cx-13*scale, 4*scale, 26*scale, 5*scale);
  } else if(hero.id==='superman'){
    c.fillStyle='#c62828';
    c.beginPath(); c.moveTo(cx-8*scale,2*scale); c.lineTo(cx,0*scale); c.lineTo(cx+8*scale,2*scale); c.lineTo(cx,8*scale); c.fill();
  } else if(hero.id==='gl'){
    c.fillStyle='#69ff47';
    roundRect(c, cx-13*scale, 3*scale, 26*scale, 8*scale, 3*scale);
    c.fill();
  } else if(hero.id==='flash'){
    c.fillStyle='#f5e642';
    c.beginPath(); c.moveTo(cx-3*scale,-2*scale); c.lineTo(cx+8*scale,6*scale); c.lineTo(cx,6*scale); c.lineTo(cx+4*scale,14*scale); c.lineTo(cx-8*scale,5*scale); c.lineTo(cx,5*scale); c.closePath(); c.fill();
  } else if(hero.id==='joker'){
    c.fillStyle='#69ff47';
    // Joker hair spikes
    for(let i=-1;i<=1;i++){
      c.beginPath(); c.moveTo(cx+i*6*scale,-2*scale); c.lineTo(cx+i*8*scale,-13*scale); c.lineTo(cx+(i+.5)*5*scale,-2*scale); c.fill();
    }
    c.fillStyle='#c62828';
    c.beginPath(); c.arc(cx,9*scale,5*scale,0.2,Math.PI-.2); c.fill();
  }

  // Arms
  c.fillStyle = hero.bodyColor;
  // Left arm
  c.fillRect(cx-20*scale, 22*scale, 8*scale, 20*scale);
  // Right arm
  c.fillRect(cx+12*scale, 22*scale, 8*scale, 20*scale);

  // Hands
  c.fillStyle='#f5c518';
  c.beginPath(); c.arc(cx-16*scale, 42*scale, 5*scale,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(cx+16*scale, 42*scale, 5*scale,0,Math.PI*2); c.fill();

  // Legs
  c.fillStyle='#333';
  c.fillRect(cx-12*scale, 48*scale, 10*scale, 18*scale);
  c.fillRect(cx+2*scale,  48*scale, 10*scale, 18*scale);

  // Feet
  c.fillStyle='#1a1a1a';
  c.fillRect(cx-14*scale, 64*scale, 12*scale, 6*scale);
  c.fillRect(cx+2*scale,  64*scale, 12*scale, 6*scale);
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}

// ── Build character cards ──
const cardsRow = document.getElementById('cardsRow');
HEROES.forEach((hero,i)=>{
  const card = document.createElement('div');
  card.className='card';
  card.id='card_'+i;

  const cv = document.createElement('canvas');
  cv.width=80; cv.height=80;
  drawCardFigure(cv, hero);

  const name = document.createElement('div');
  name.className='card-name';
  name.style.color=hero.bodyColor==='#2a2a2a'?'#222':hero.bodyColor;
  name.textContent=hero.name;

  const pwr = document.createElement('div');
  pwr.className='card-power';
  pwr.style.whiteSpace='pre-line';
  pwr.textContent=hero.powerDesc;

  card.append(cv,name,pwr);
  card.onclick=()=>{
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    selectedHero=hero;
    document.getElementById('playBtn').disabled=false;
  };
  cardsRow.appendChild(card);
});

// ═══════════════════════════════════════════════
//  GAME ENGINE
// ═══════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
let W,H, scaleX,scaleY, running=false;

const WORLD_W = 3200, WORLD_H = 520;
const GROUND_Y = WORLD_H - 80;
const HUD_H = 52;

let camera, player, henchmen, golds, projectiles, particles;
let gameTimer=0, lastTime=null;
let keys={};

function resize(){
  W=canvas.width =window.innerWidth;
  H=canvas.height=window.innerHeight;
  scaleX=W/WORLD_W;
  scaleY=(H-HUD_H)/WORLD_H;
}
window.addEventListener('resize',resize);

window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyX'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup',e=>{ keys[e.code]=false; });

// ── Level data ──────────────────────────────
const PLATFORMS = [
  // Ground
  {x:0,    y:GROUND_Y, w:WORLD_W, h:80, color:'#4caf50', isGround:true},
  // Floating bricks
  {x:300,  y:350, w:160, h:24, color:'#e63030'},
  {x:560,  y:290, w:120, h:24, color:'#1565c0'},
  {x:750,  y:370, w:200, h:24, color:'#f5e642'},
  {x:1020, y:310, w:140, h:24, color:'#e63030'},
  {x:1200, y:260, w:180, h:24, color:'#2e7d32'},
  {x:1480, y:340, w:120, h:24, color:'#1565c0'},
  {x:1700, y:280, w:160, h:24, color:'#e63030'},
  {x:1950, y:370, w:200, h:24, color:'#f5e642'},
  {x:2200, y:300, w:140, h:24, color:'#6a1b9a'},
  {x:2440, y:250, w:180, h:24, color:'#e63030'},
  {x:2700, y:350, w:160, h:24, color:'#2e7d32'},
  {x:2920, y:290, w:200, h:24, color:'#1565c0'},
];

// Buildings (background decoration)
const BUILDINGS = [
  {x:100,  w:140, h:220, color:'#90caf9', windows:true},
  {x:600,  w:100, h:160, color:'#ef9a9a', windows:true},
  {x:900,  w:180, h:280, color:'#a5d6a7', windows:true},
  {x:1300, w:120, h:200, color:'#ce93d8', windows:true},
  {x:1600, w:160, h:240, color:'#80cbc4', windows:true},
  {x:1900, w:100, h:180, color:'#ffcc80', windows:true},
  {x:2100, w:140, h:260, color:'#90caf9', windows:true},
  {x:2400, w:180, h:200, color:'#ef9a9a', windows:true},
  {x:2650, w:120, h:300, color:'#a5d6a7', windows:true},
  {x:2900, w:160, h:220, color:'#ce93d8', windows:true},
  // Justice League HQ
  {x:380,  w:200, h:340, color:'#1565c0', isJLHQ:true},
];

// Gold positions
const GOLD_POSITIONS = [
  {x:80,   y:GROUND_Y-28},{x:200,  y:GROUND_Y-28},
  {x:320,  y:310},        {x:450,  y:GROUND_Y-28},
  {x:590,  y:250},        {x:680,  y:GROUND_Y-28},
  {x:780,  y:330},        {x:950,  y:GROUND_Y-28},
  {x:1050, y:270},        {x:1220, y:220},
  {x:1380, y:GROUND_Y-28},{x:1510, y:300},
  {x:1720, y:240},        {x:1850, y:GROUND_Y-28},
  {x:2050, y:330},        {x:2220, y:260},
  {x:2360, y:GROUND_Y-28},{x:2460, y:210},
  {x:2600, y:GROUND_Y-28},{x:2720, y:310},
].slice(0,15);

// Henchman start positions (x, platform index they patrol)
const HENCHMAN_STARTS = [
  {x:350,  platIdx:1},{x:600,  platIdx:2},
  {x:1050, platIdx:4},{x:1500, platIdx:6},
  {x:1720, platIdx:7},{x:2450, platIdx:9},
];

// ── Clouds ──────────────────────────────────
let clouds = [];
for(let i=0;i<12;i++){
  clouds.push({
    x: Math.random()*WORLD_W,
    y: 30+Math.random()*120,
    w: 80+Math.random()*120,
    speed: 12+Math.random()*18
  });
}

// ═══════════════════════════════════════════════
//  START GAME
// ═══════════════════════════════════════════════
function startGame(){
  if(!selectedHero) return;
  document.getElementById('selectScreen').style.display='none';
  canvas.style.display='block';
  resize();
  initGame();
  requestAnimationFrame(loop);
}

function initGame(){
  running=true; gameTimer=0; lastTime=null;

  camera={x:0};

  player={
    x:60, y:GROUND_Y-70,
    vx:0, vy:0,
    w:28, h:60,
    onGround:false,
    jumpsLeft:2,
    lives:3,
    hitTimer:0,
    hero:selectedHero,
    facing:1,
    walkFrame:0,
    walkTimer:0,
    isFlying:false,
    shieldTimer:0,
    specialCooldown:0,
    dead:false
  };

  golds = GOLD_POSITIONS.map((g,i)=>({
    x:g.x, y:g.y, w:26, h:18,
    collected:false, stolen:false,
    bobPhase:i*0.8,
    carriedBy:null
  }));

  henchmen = HENCHMAN_STARTS.map((h,i)=>{
    const plat = PLATFORMS[h.platIdx];
    return {
      x:h.x, y:plat.y-52, w:24, h:52,
      vx: i%2===0 ? 60 : -60,
      platIdx:h.platIdx,
      onGround:false,
      hitTimer:0,
      dead:false,
      confused:false,
      confusedTimer:0,
      carrying:null,
      walkFrame:0,
      walkTimer:0,
      facing: i%2===0?1:-1
    };
  });

  projectiles=[];
  particles=[];
}

// ═══════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════
const GRAVITY=1600, JUMP_FORCE=-620;

function update(dt){
  gameTimer+=dt;

  // ── Player movement ──
  const spd = 260 * player.hero.speed;
  const isFlash = player.hero.id==='flash';
  const isSuper = player.hero.id==='superman';

  if(!player.dead){
    if(keys['ArrowLeft']||keys['KeyA']){ player.vx=-spd; player.facing=-1; }
    else if(keys['ArrowRight']||keys['KeyD']){ player.vx=spd; player.facing=1; }
    else player.vx*=.7;

    // Jump
    if((keys['Space']||keys['ArrowUp']||keys['KeyW']) && !keys['_jumpHeld']){
      keys['_jumpHeld']=true;
      if(player.jumpsLeft>0){
        player.vy=JUMP_FORCE*player.hero.jumpMult;
        player.jumpsLeft--;
        player.isFlying=false;
      }
    }
    if(!(keys['Space']||keys['ArrowUp']||keys['KeyW'])) keys['_jumpHeld']=false;

    // Superman float
    if(isSuper && (keys['Space']||keys['ArrowUp']) && player.vy>0 && player.jumpsLeft===0){
      player.vy-=800*dt;
      if(player.vy<-50) player.vy=-50;
    }

    // Special
    if(keys['KeyX'] && !keys['_xHeld'] && player.specialCooldown<=0){
      keys['_xHeld']=true;
      doSpecial();
    }
    if(!keys['KeyX']) keys['_xHeld']=false;

    // Physics
    player.vy+=GRAVITY*dt;
    player.x+=player.vx*dt;
    player.y+=player.vy*dt;

    // Flash speed boost: sprint particles
    if(isFlash && Math.abs(player.vx)>200){
      if(Math.random()<.3) spawnParticle(player.x,player.y+30,'#f5e642',2,'#c62828');
    }

    platformCollide(player);
    player.x=Math.max(0,Math.min(WORLD_W-player.w,player.x));
    if(player.y>WORLD_H){ player.y=WORLD_H; loseLife(); }

    if(player.hitTimer>0) player.hitTimer-=dt;
    if(player.shieldTimer>0) player.shieldTimer-=dt;
    if(player.specialCooldown>0) player.specialCooldown-=dt;

    player.walkTimer+=dt;
    if(Math.abs(player.vx)>20 && player.onGround){
      if(player.walkTimer>.1){ player.walkFrame=(player.walkFrame+1)%4; player.walkTimer=0; }
    }
  }

  // ── Henchmen ──
  for(const h of henchmen){
    if(h.dead) continue;
    if(h.confusedTimer>0) h.confusedTimer-=dt;
    else h.confused=false;

    const plat=PLATFORMS[h.platIdx];
    // Patrol within platform bounds
    const edge=16;
    if(h.x<=plat.x+edge){ h.vx=Math.abs(h.vx); h.facing=1; }
    if(h.x+h.w>=plat.x+plat.w-edge){ h.vx=-Math.abs(h.vx); h.facing=-1; }
    if(h.confused){ h.vx=-h.vx; h.confused=false; } // confusion reverses

    h.x+=h.vx*dt;
    h.y=plat.y-h.h;

    h.walkTimer+=dt;
    if(h.walkTimer>.12){ h.walkFrame=(h.walkFrame+1)%4; h.walkTimer=0; }

    // Pick up nearby gold
    if(!h.carrying){
      for(const g of golds){
        if(g.collected||g.stolen||g.carriedBy) continue;
        if(Math.abs(g.x-h.x)<40 && Math.abs(g.y-h.y)<60){
          g.carriedBy=h; h.carrying=g;
          break;
        }
      }
    }

    if(h.carrying){
      h.carrying.x=h.x+h.w/2-13;
      h.carrying.y=h.y-22;
      // Henchman off platform edge = drop gold as "stolen"
      if(h.x<plat.x+4||h.x+h.w>plat.x+plat.w-4){
        // drop
        h.carrying.carriedBy=null; h.carrying=null;
      }
    }

    // Player stomp detection (player falling onto henchman head)
    if(!player.dead && player.vy>0 && player.hitTimer<=0){
      const px=player.x+player.w/2, py=player.y+player.h;
      const hcx=h.x+h.w/2, hcy=h.y;
      if(Math.abs(px-hcx)<26 && Math.abs(py-hcy)<22){
        stompHenchman(h);
        player.vy=-400;
      }
    }

    // Player body collision (not stomp)
    if(!player.dead && player.hitTimer<=0 && player.shieldTimer<=0){
      if(rectsOverlap(player,h)){
        loseLife();
      }
    }
  }

  // ── Projectiles ──
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if(p.life<=0||p.x<0||p.x>WORLD_W){ projectiles.splice(i,1); continue; }
    // Hit henchman
    let hit=false;
    for(const h of henchmen){
      if(h.dead) continue;
      if(Math.abs(p.x-h.x-h.w/2)<20 && Math.abs(p.y-h.y-h.h/2)<28){
        if(p.type==='pie'){ h.confused=true; h.confusedTimer=3; h.vx=-h.vx; }
        else stompHenchman(h);
        projectiles.splice(i,1); hit=true; break;
      }
    }
    if(!hit){} // keep
  }

  // ── Gold collect ──
  let stolenCount=0, collectedCount=0;
  for(const g of golds){
    if(g.stolen){ stolenCount++; continue; }
    if(g.collected){ collectedCount++; continue; }
    g.bobPhase+=dt*3;

    if(!g.carriedBy && rectsOverlapXY(player.x,player.y,player.w,player.h,g.x,g.y,g.w,g.h)){
      g.collected=true; collectedCount++;
      spawnParticlesAt(g.x+13,g.y+9,'#f5e642',12);
    }
  }

  // ── Henchman drops gold offscreen / steals ──
  for(const g of golds){
    if(!g.collected && !g.stolen && g.carriedBy && g.carriedBy.dead){
      g.carriedBy=null; // drop if henchman dies
    }
  }

  // ── Win/Lose checks ──
  if(collectedCount>=15) return showWin(collectedCount, gameTimer);
  if(stolenCount+collectedCount>=15 && stolenCount>0) return showLose('stolen');
  if(player.lives<=0) return showLose('lives');

  // ── Particles ──
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=.18;
    p.life-=p.decay; if(p.life<=0) particles.splice(i,1);
  }

  // ── Camera ──
  const targetCamX = player.x-W*.35;
  camera.x+=(targetCamX-camera.x)*.12;
  camera.x=Math.max(0,Math.min(WORLD_W-W,camera.x));

  // ── Clouds ──
  for(const cl of clouds){
    cl.x-=cl.speed*dt;
    if(cl.x+cl.w<0) cl.x=WORLD_W+20;
  }
}

// ── Special abilities ──────────────────────
function doSpecial(){
  const h=player.hero;
  player.specialCooldown=2.5;
  if(h.id==='batman'){
    projectiles.push({x:player.x+player.w/2,y:player.y+20,vx:player.facing*700,vy:-60,life:1.5,type:'batarang',rot:0});
  } else if(h.id==='gl'){
    player.shieldTimer=2.5;
    spawnParticlesAt(player.x+14,player.y+30,'#69ff47',20);
  } else if(h.id==='flash'){
    player.vx=player.facing*900; player.specialCooldown=1;
    spawnParticlesAt(player.x+14,player.y+30,'#c62828',15);
  } else if(h.id==='joker'){
    projectiles.push({x:player.x+player.w/2,y:player.y+20,vx:player.facing*500,vy:-80,life:1.2,type:'pie',rot:0});
  } else if(h.id==='superman'){
    // Super punch — stun all nearby henchmen
    for(const en of henchmen){
      if(!en.dead && Math.abs(en.x-player.x)<180){
        en.confusedTimer=2; en.confused=true;
        spawnParticlesAt(en.x+12,en.y+26,'#f5e642',10);
      }
    }
  }
}

function stompHenchman(h){
  if(h.dead) return;
  h.dead=true;
  if(h.carrying){ h.carrying.carriedBy=null; h.carrying=null; }
  spawnParticlesAt(h.x+12,h.y+26,'#6a1b9a',18);
  spawnParticlesAt(h.x+12,h.y+26,'#69ff47',10);
}

function loseLife(){
  if(player.dead||player.hitTimer>0) return;
  player.lives--;
  player.hitTimer=1.5;
  player.vy=-350;
  spawnParticlesAt(player.x+14,player.y+30,'#e63030',16);
}

// ── Platform collision ──────────────────────
function platformCollide(obj){
  obj.onGround=false;
  for(const p of PLATFORMS){
    const ol=obj.x<p.x+p.w, or=obj.x+obj.w>p.x;
    const ot=obj.y<p.y+p.h, ob=obj.y+obj.h>p.y;
    if(ol&&or&&ot&&ob){
      const dLeft  = (obj.x+obj.w)-p.x;
      const dRight = (p.x+p.w)-obj.x;
      const dTop   = (obj.y+obj.h)-p.y;
      const dBottom= (p.y+p.h)-obj.y;
      const minD   = Math.min(dLeft,dRight,dTop,dBottom);
      if(minD===dTop && obj.vy>=0){
        obj.y=p.y-obj.h; obj.vy=0; obj.onGround=true;
        if(obj===player){ player.jumpsLeft=player.hero.id==='superman'?2:1; }
      } else if(minD===dBottom && obj.vy<0){ obj.y=p.y+p.h; obj.vy=0; }
      else if(minD===dLeft)  obj.x=p.x-obj.w;
      else if(minD===dRight) obj.x=p.x+p.w;
    }
  }
}

function rectsOverlap(a,b){
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}
function rectsOverlapXY(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}

// ── Particles ──────────────────────────────
function spawnParticle(x,y,col1,n,col2){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=Math.random()*5+2;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,decay:.035,r:3+Math.random()*4,color:Math.random()<.5?col1:col2});
  }
}
function spawnParticlesAt(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=Math.random()*6+2;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:1,decay:.028,r:3+Math.random()*5,color});
  }
}

// ═══════════════════════════════════════════════
//  DRAW
// ═══════════════════════════════════════════════
function draw(){
  const scale = Math.min(W/WORLD_W,(H-HUD_H)/WORLD_H);
  const offX  = -camera.x;

  ctx.clearRect(0,0,W,H);

  // ── HUD bar ──────────────────────────────
  ctx.fillStyle='#f5e642';
  ctx.fillRect(0,0,W,HUD_H);
  ctx.fillStyle='#e6b800';
  ctx.fillRect(0,HUD_H-4,W,4);

  // Hearts
  const HS=22;
  ctx.font=`${HS}px sans-serif`;
  for(let i=0;i<3;i++){
    ctx.fillStyle=i<player.lives?'#e63030':'#ccc';
    ctx.fillText('♥',12+i*(HS+4),HUD_H-10);
  }

  // Gold count
  const goldCollected=golds.filter(g=>g.collected).length;
  const goldStolen   =golds.filter(g=>g.stolen).length;
  ctx.fillStyle='#1a1a1a';
  ctx.font=`bold 16px Bangers`;
  ctx.letterSpacing='1px';
  ctx.textAlign='center';
  ctx.fillText(`⚡ ${player.hero.name.replace('\n',' ')}`,W/2,30);
  ctx.font='bold 13px Nunito';
  ctx.fillText(`GOLD: ${goldCollected}/15  |  STOLEN: ${goldStolen}`,W/2,HUD_H-10);
  ctx.textAlign='left';

  // Timer
  ctx.fillStyle='#555';
  ctx.font='bold 13px Nunito';
  ctx.textAlign='right';
  ctx.fillText(`⏱ ${Math.floor(gameTimer)}s`,W-12,HUD_H-10);
  ctx.textAlign='left';
  ctx.letterSpacing='0px';

  // ── Game world (scaled + translated) ────
  ctx.save();
  ctx.translate(0, HUD_H);

  const sx=W/WORLD_W, sy=(H-HUD_H)/WORLD_H;
  ctx.scale(sx,sy);
  ctx.translate(-camera.x,0);

  drawWorld();

  ctx.restore();
}

function drawWorld(){
  // Sky
  const sky=ctx.createLinearGradient(0,0,0,WORLD_H);
  sky.addColorStop(0,'#64b5f6'); sky.addColorStop(1,'#bbdefb');
  ctx.fillStyle=sky; ctx.fillRect(camera.x,0,WORLD_W,WORLD_H);

  // Sun
  ctx.fillStyle='#fff176';
  ctx.shadowColor='#f5e642'; ctx.shadowBlur=40;
  ctx.beginPath(); ctx.arc(camera.x+80,60,38,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  // Clouds
  ctx.fillStyle='rgba(255,255,255,.92)';
  for(const cl of clouds){
    drawCloud(cl.x,cl.y,cl.w);
  }

  // Background buildings
  for(const b of BUILDINGS){
    if(b.x+b.w<camera.x-50||b.x>camera.x+WORLD_W+50) continue;
    drawBuilding(b);
  }

  // Platforms
  for(const p of PLATFORMS){
    if(p.isGround) drawGround(p);
    else drawPlatform(p);
  }

  // Gold bars
  for(const g of golds){
    if(g.collected||g.stolen) continue;
    drawGold(g);
  }

  // Henchmen
  for(const h of henchmen){
    if(h.dead) continue;
    drawHenchman(h);
  }

  // Projectiles
  for(const p of projectiles){
    drawProjectile(p);
  }

  // Player
  if(!player.dead||(player.dead&&player.hitTimer>0)){
    drawPlayer(player);
  }

  // Particles
  for(const p of particles){
    ctx.save();
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // GL Shield
  if(player.shieldTimer>0){
    ctx.save();
    ctx.globalAlpha=.3+.15*Math.sin(gameTimer*10);
    ctx.strokeStyle='#69ff47'; ctx.lineWidth=6;
    ctx.shadowColor='#69ff47'; ctx.shadowBlur=20;
    ctx.beginPath(); ctx.arc(player.x+player.w/2,player.y+player.h/2,40,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // Special cooldown indicator (small bar under player)
  if(player.specialCooldown>0){
    const bw=50, bh=5;
    const bx=player.x+player.w/2-bw/2, by=player.y+player.h+6;
    ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#f5e642';
    ctx.fillRect(bx,by,bw*(1-player.specialCooldown/2.5),bh);
  }
}

// ── Draw helpers ──────────────────────────
function drawCloud(x,y,w){
  const h=w*.4;
  ctx.beginPath();
  ctx.arc(x+w*.2,y,h*.6,0,Math.PI*2);
  ctx.arc(x+w*.5,y-h*.2,h*.75,0,Math.PI*2);
  ctx.arc(x+w*.8,y,h*.6,0,Math.PI*2);
  ctx.arc(x+w*.2,y+h*.2,h*.5,0,Math.PI*2);
  ctx.arc(x+w*.8,y+h*.2,h*.5,0,Math.PI*2);
  ctx.fill();
}

function drawBuilding(b){
  if(b.isJLHQ){
    // Justice League HQ
    ctx.fillStyle='#1565c0';
    ctx.fillRect(b.x,GROUND_Y-b.h,b.w,b.h);
    // Gold trim
    ctx.fillStyle='#f5e642';
    ctx.fillRect(b.x,GROUND_Y-b.h,b.w,8);
    ctx.fillRect(b.x,GROUND_Y-b.h*2/3,b.w,6);
    ctx.fillRect(b.x,GROUND_Y-b.h/3,b.w,6);
    // JL Logo circle
    ctx.fillStyle='#f5e642';
    ctx.beginPath(); ctx.arc(b.x+b.w/2,GROUND_Y-b.h*.75,30,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1565c0';
    ctx.font='bold 22px Bangers'; ctx.textAlign='center';
    ctx.fillText('JL',b.x+b.w/2,GROUND_Y-b.h*.75+8);
    ctx.textAlign='left';
    // Studs on top
    drawStudRow(b.x,GROUND_Y-b.h,b.w,10,'#1565c0');
    // Windows
    for(let row=0;row<4;row++){
      for(let col=0;col<3;col++){
        ctx.fillStyle=Math.random()<.7?'#fff176':'#90caf9';
        ctx.fillRect(b.x+14+col*56,GROUND_Y-b.h+18+row*70,28,36);
      }
    }
  } else {
    ctx.fillStyle=b.color;
    ctx.fillRect(b.x,GROUND_Y-b.h,b.w,b.h);
    // Outline
    ctx.strokeStyle='rgba(0,0,0,.12)'; ctx.lineWidth=2;
    ctx.strokeRect(b.x,GROUND_Y-b.h,b.w,b.h);
    // Studs
    drawStudRow(b.x,GROUND_Y-b.h,b.w,8,b.color);
    // Windows
    const wCols=Math.max(1,Math.floor(b.w/40));
    const wRows=Math.max(1,Math.floor(b.h/50));
    for(let r=0;r<wRows;r++){
      for(let c=0;c<wCols;c++){
        ctx.fillStyle=r%2===0?'#fff9c4':'#e1f5fe';
        ctx.fillRect(b.x+10+c*(b.w-20)/Math.max(1,wCols-1),GROUND_Y-b.h+16+r*46,22,28);
      }
    }
  }
}

function drawStudRow(x,y,w,r,baseColor){
  const n=Math.max(1,Math.floor(w/(r*2.6)));
  const step=w/n;
  for(let i=0;i<n;i++){
    ctx.fillStyle=lighten(baseColor,.15);
    ctx.beginPath(); ctx.arc(x+step*.5+i*step,y-r*.6,r*.7,0,Math.PI*2); ctx.fill();
  }
}

function lighten(hex,amt){
  // simple lighten
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+amt*255)},${Math.min(255,g+amt*255)},${Math.min(255,b+amt*255)})`;
}

function drawGround(p){
  // Green ground
  ctx.fillStyle='#4caf50';
  ctx.fillRect(p.x,p.y,p.w,p.h);
  // Sidewalk strip
  ctx.fillStyle='#bdbdbd';
  ctx.fillRect(p.x,p.y,p.w,14);
  // Dividers
  ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=2;
  for(let x=0;x<p.w;x+=80){ ctx.beginPath(); ctx.moveTo(p.x+x,p.y+4); ctx.lineTo(p.x+x,p.y+10); ctx.stroke(); }
}

function drawPlatform(p){
  ctx.fillStyle=p.color;
  ctx.fillRect(p.x,p.y,p.w,p.h);
  // Bottom shadow
  ctx.fillStyle='rgba(0,0,0,.2)';
  ctx.fillRect(p.x,p.y+p.h-4,p.w,4);
  // Studs
  const n=Math.max(1,Math.floor(p.w/22));
  const step=p.w/n;
  for(let i=0;i<n;i++){
    ctx.fillStyle=lighten(p.color,.2);
    ctx.beginPath(); ctx.arc(p.x+step*.5+i*step,p.y-4,5,0,Math.PI*2); ctx.fill();
  }
}

function drawGold(g){
  const bob=Math.sin(g.bobPhase)*3;
  ctx.save(); ctx.translate(0,bob);
  // Glow
  ctx.shadowColor='#f5e642'; ctx.shadowBlur=14;
  // Bar
  ctx.fillStyle='#f5e642';
  ctx.fillRect(g.x,g.y,g.w,g.h);
  ctx.fillStyle='#e6b800';
  ctx.fillRect(g.x+3,g.y+3,g.w-6,g.h-6);
  // Shine
  ctx.fillStyle='rgba(255,255,200,.7)';
  ctx.fillRect(g.x+4,g.y+3,5,4);
  // $ symbol
  ctx.fillStyle='#7a5000';
  ctx.font='bold 11px Nunito'; ctx.textAlign='center';
  ctx.fillText('$',g.x+g.w/2,g.y+g.h-3);
  ctx.shadowBlur=0; ctx.textAlign='left';
  ctx.restore();
}

function drawHenchman(h){
  const flash=h.hitTimer>0 && Math.sin(h.hitTimer*20)>0;
  const bob=Math.sin(h.walkFrame*.8)*3;
  ctx.save();
  ctx.translate(h.x+h.w/2, h.y);
  ctx.scale(h.facing,1);
  if(h.confused){ ctx.rotate(Math.sin(gameTimer*8)*.15); }
  if(flash){ ctx.globalAlpha=.4; }

  const sc=h.w/28;

  // Body - purple
  ctx.fillStyle='#6a1b9a';
  roundRect(ctx,-11*sc,16*sc,22*sc,24*sc,3*sc); ctx.fill();

  // Tie (green)
  ctx.fillStyle='#69ff47';
  ctx.beginPath(); ctx.moveTo(0,18*sc); ctx.lineTo(-4*sc,28*sc); ctx.lineTo(0,36*sc); ctx.lineTo(4*sc,28*sc); ctx.closePath(); ctx.fill();

  // Neck
  ctx.fillStyle='#f5c518';
  ctx.fillRect(-4*sc,10*sc,8*sc,8*sc);

  // Head
  ctx.fillStyle='#f5c518';
  roundRect(ctx,-11*sc,-4*sc,22*sc,16*sc,4*sc); ctx.fill();

  // Green hair spikes
  ctx.fillStyle='#69ff47';
  for(let s=-1;s<=1;s++){
    ctx.beginPath(); ctx.moveTo(s*6*sc,-4*sc); ctx.lineTo(s*8*sc,-14*sc); ctx.lineTo((s+.5)*5*sc,-4*sc); ctx.fill();
  }

  // Eyes
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-4*sc,2*sc,3*sc,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4*sc,2*sc,3*sc,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=h.confused?'#ff0':'#1a1a1a';
  ctx.beginPath(); ctx.arc(-4*sc,2*sc,1.5*sc,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4*sc,2*sc,1.5*sc,0,Math.PI*2); ctx.fill();

  // Big red smile
  ctx.strokeStyle='#c62828'; ctx.lineWidth=2*sc; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,5*sc,6*sc,0.1,Math.PI-.1); ctx.stroke();

  // Arms
  ctx.fillStyle='#6a1b9a';
  const legBob=Math.sin(h.walkFrame*.8)*6;
  ctx.fillRect(-18*sc,18*sc,7*sc,16*sc);
  ctx.fillRect(11*sc,18*sc,7*sc,16*sc);

  // Hands
  ctx.fillStyle='#f5c518';
  ctx.beginPath(); ctx.arc(-14*sc,34*sc,4*sc,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(14*sc,34*sc,4*sc,0,Math.PI*2); ctx.fill();

  // Legs with walk bob
  ctx.fillStyle='#4a0072';
  ctx.fillRect(-10*sc,40*sc,8*sc,14*sc+legBob/2);
  ctx.fillRect(2*sc,40*sc,8*sc,14*sc-legBob/2);

  ctx.restore();

  // Confused "?" indicator
  if(h.confused){
    ctx.fillStyle='#f5e642'; ctx.font='bold 18px Bangers'; ctx.textAlign='center';
    ctx.fillText('?!',h.x+h.w/2,h.y-10);
    ctx.textAlign='left';
  }
}

function drawPlayer(p){
  const hero=p.hero;
  const flash2=p.hitTimer>0 && Math.sin(p.hitTimer*20)>0;
  const legBob=p.onGround&&Math.abs(p.vx)>20 ? Math.sin(p.walkFrame*.8)*8 : 0;

  ctx.save();
  ctx.translate(p.x+p.w/2, p.y);
  ctx.scale(p.facing,1);
  if(flash2) ctx.globalAlpha=.35;

  const sc=p.w/28;

  // Cape
  ctx.fillStyle=hero.capeColor;
  if(hero.id==='batman'||hero.id==='superman'){
    ctx.beginPath();
    ctx.moveTo(-8*sc,16*sc); ctx.bezierCurveTo(-22*sc,22*sc,-24*sc,48*sc,-16*sc,58*sc);
    ctx.lineTo(-6*sc,52*sc); ctx.closePath(); ctx.fill();
  }

  // Body
  ctx.fillStyle=hero.bodyColor;
  roundRect(ctx,-12*sc,14*sc,24*sc,26*sc,3*sc); ctx.fill();

  // Accent emblem
  ctx.fillStyle=hero.accentColor;
  if(hero.id==='batman'){
    // Bat symbol
    ctx.beginPath(); ctx.arc(-6*sc,26*sc,5*sc,Math.PI,0); ctx.arc(6*sc,26*sc,5*sc,Math.PI,0); ctx.lineTo(8*sc,28*sc); ctx.lineTo(0,22*sc); ctx.lineTo(-8*sc,28*sc); ctx.closePath(); ctx.fill();
  } else if(hero.id==='superman'){
    ctx.beginPath(); ctx.moveTo(-6*sc,20*sc); ctx.lineTo(0,16*sc); ctx.lineTo(6*sc,20*sc); ctx.lineTo(0,32*sc); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#c62828'; ctx.font=`bold ${12*sc}px Bangers`; ctx.textAlign='center';
    ctx.fillText('S',0,30*sc); ctx.textAlign='left';
  } else if(hero.id==='gl'){
    ctx.beginPath(); ctx.arc(0,26*sc,7*sc,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=hero.bodyColor; ctx.beginPath(); ctx.arc(0,26*sc,4*sc,0,Math.PI*2); ctx.fill();
  } else if(hero.id==='flash'){
    ctx.beginPath(); ctx.moveTo(-2*sc,16*sc); ctx.lineTo(8*sc,24*sc); ctx.lineTo(0,24*sc); ctx.lineTo(4*sc,36*sc); ctx.lineTo(-8*sc,26*sc); ctx.lineTo(0,26*sc); ctx.closePath(); ctx.fill();
  } else if(hero.id==='joker'){
    ctx.font=`${11*sc}px Nunito`; ctx.textAlign='center';
    ctx.fillText('HA',0,30*sc); ctx.textAlign='left';
  }

  // Neck
  ctx.fillStyle='#f5c518';
  ctx.fillRect(-4*sc,8*sc,8*sc,8*sc);

  // Head
  ctx.fillStyle='#f5c518';
  roundRect(ctx,-12*sc,-6*sc,24*sc,16*sc,4*sc); ctx.fill();

  // Helmet/accessory
  if(hero.id==='batman'){
    ctx.fillStyle='#1a1a1a';
    ctx.beginPath(); ctx.moveTo(-12*sc,-6*sc); ctx.lineTo(-15*sc,-16*sc); ctx.lineTo(-6*sc,-6*sc); ctx.fill();
    ctx.beginPath(); ctx.moveTo(12*sc,-6*sc); ctx.lineTo(15*sc,-16*sc); ctx.lineTo(6*sc,-6*sc); ctx.fill();
    ctx.fillRect(-12*sc,-2*sc,24*sc,7*sc); // mask
  } else if(hero.id==='superman'){
    ctx.fillStyle='#1565c0'; ctx.fillRect(-12*sc,-6*sc,24*sc,7*sc); // hair top
  } else if(hero.id==='gl'){
    ctx.fillStyle='#1b5e20'; ctx.fillRect(-12*sc,-6*sc,24*sc,6*sc);
    ctx.fillStyle='#69ff47'; roundRect(ctx,-12*sc,-2*sc,24*sc,7*sc,2*sc); ctx.fill();
  } else if(hero.id==='flash'){
    ctx.fillStyle='#c62828'; ctx.fillRect(-12*sc,-6*sc,24*sc,10*sc);
    // Lightning ears
    ctx.fillStyle='#f5e642';
    ctx.beginPath(); ctx.moveTo(-12*sc,-2*sc); ctx.lineTo(-18*sc,-8*sc); ctx.lineTo(-10*sc,0); ctx.fill();
    ctx.beginPath(); ctx.moveTo(12*sc,-2*sc); ctx.lineTo(18*sc,-8*sc); ctx.lineTo(10*sc,0); ctx.fill();
  } else if(hero.id==='joker'){
    ctx.fillStyle='#69ff47';
    for(let s=-1;s<=1;s++){ ctx.beginPath(); ctx.moveTo(s*5*sc,-6*sc); ctx.lineTo(s*7*sc,-16*sc); ctx.lineTo((s+.5)*4*sc,-6*sc); ctx.fill(); }
    ctx.fillStyle='#c62828'; ctx.fillRect(-12*sc,-1*sc,24*sc,5*sc); // red smile area
  }

  // Stud on head
  ctx.fillStyle='#e6b800';
  ctx.beginPath(); ctx.arc(0,-8*sc,4*sc,0,Math.PI*2); ctx.fill();

  // Eyes
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath(); ctx.arc(-4*sc,2*sc,2.2*sc,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4*sc,2*sc,2.2*sc,0,Math.PI*2); ctx.fill();

  // Arms with running pose
  ctx.fillStyle=hero.bodyColor;
  ctx.fillRect(-20*sc,16*sc,8*sc,18*sc);
  ctx.fillRect(12*sc,16*sc,8*sc,18*sc);

  // Hands
  ctx.fillStyle='#f5c518';
  ctx.beginPath(); ctx.arc(-16*sc,34*sc,4.5*sc,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(16*sc,34*sc,4.5*sc,0,Math.PI*2); ctx.fill();

  // Legs
  ctx.fillStyle='#333';
  ctx.fillRect(-10*sc,40*sc,8*sc,16*sc+legBob/2);
  ctx.fillRect(2*sc, 40*sc,8*sc,16*sc-legBob/2);

  ctx.fillStyle='#1a1a1a';
  ctx.fillRect(-12*sc,54*sc+legBob/2,12*sc,6*sc);
  ctx.fillRect(2*sc, 54*sc-legBob/2,12*sc,6*sc);

  ctx.restore();

  // Name above
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.55)';
  ctx.font=`bold 13px Bangers`;
  ctx.textAlign='center';
  ctx.fillText(hero.name.replace('\n',' '),p.x+p.w/2,p.y-14);
  ctx.textAlign='left';
  ctx.restore();
}

function drawProjectile(p){
  ctx.save();
  ctx.translate(p.x,p.y);
  p.rot+=.15;
  ctx.rotate(p.rot);
  if(p.type==='batarang'){
    ctx.fillStyle='#1a1a1a';
    ctx.beginPath(); ctx.moveTo(-12,0); ctx.lineTo(0,-6); ctx.lineTo(12,0); ctx.lineTo(0,6); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#f5e642';
    ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(0,-3); ctx.lineTo(6,0); ctx.lineTo(0,3); ctx.closePath(); ctx.fill();
  } else {
    // Pie
    ctx.fillStyle='#fff9c4';
    ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#69ff47';
    ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#c62828';
    ctx.font='10px sans-serif'; ctx.textAlign='center';
    ctx.fillText('😆',0,4); ctx.textAlign='left';
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════
//  WIN / LOSE
// ═══════════════════════════════════════════════
function showWin(count,time){
  running=false;
  document.getElementById('winSub').textContent=
    `All ${count} gold bars recovered in ${Math.floor(time)}s! The city is safe! 🌟`;
  document.getElementById('winScreen').style.display='flex';
}

function showLose(reason){
  running=false;
  document.getElementById('loseSub').textContent=
    reason==='stolen'?'Joker\'s henchmen stole all the gold!':'You ran out of lives...';
  document.getElementById('loseScreen').style.display='flex';
}

// ═══════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════
function loop(ts){
  if(!running) return;
  const dt=Math.min((ts-(lastTime||ts))/1000,.05);
  lastTime=ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
